<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServDeck 高保真 — 服务详情页（双击替换主区 · 概览 / 部署 / 运行环境 / 日志 / 事件）</title>
<!--
  设计说明 v2 —— 形态变更：抽屉 → 主区内容替换
  ------------------------------------------------------------------
  · 触发：左侧服务树【双击】服务节点 → 右侧主区由「服务总览」整体切换为「服务详情页」
    （单击仅选中高亮；顶部「← 服务总览」返回，ESC 亦可返回）
  · 与 v1 的差异：
      v1 = inspector 抽屉浮层（覆盖式，680px）
      v2 = 主区视图替换（占满主区，信息密度更高，资源区可 4 列铺开）
  · 信息架构（本页重点：当前服务状态 + 占用资源）：
      [返回导航] → [Hero 服务头] → [状态条 8 格 · 常驻] → [页签内容]
      概览     ← 资源卡组（CPU/内存/线程/句柄/磁盘IO/网络IO/目录占用/运行时长）
                 + 资源趋势（CPU+内存 近 30 分钟）+ 基本信息（servy 安装参数快照）
      部署     ← 脚本 [1] Install：托管状态 → 启动参数表单 → 安装命令实时预览
                 + 脚本 DEPS_PORTS 依赖端口预检；脚本 [6] Uninstall
      运行环境 ← 脚本 [5] Version Info（java -version / servy-cli version）
                 + 程序文件（脚本的「自动查找最新 JAR」/ rustfs.exe）
                 + 服务端点与访问凭据（来自 rustfs-service.bat 的控制台/API/账号密码）
                 + 数据目录容量（rustfs DATA_DIR）+ 环境自检（脚本顶部依赖文件检查）
      日志     ← --stdout / --stderr / --enableSizeRotation（轮转文件管理）
      事件     ← 启停 / 崩溃守护重启 / 配置变更 / 依赖端口告警 / 注册卸载 时间线
  · 脚本映射依据：
      JavaServiceDeploy-servy-cli版本.bat —— 主菜单六项、INSTALL 三步、servy 安装参数、
        JVM 参数 -Xms2g -Xmx2g、LOG_DIR=applogs、DEPS_PORTS 预检、java/servy 版本
      rustfs-service.bat —— config\rustfs.conf 的 KEY=VALUE 解析、data 目录、
        server <volumes> --console-address :9001 --address :9000、access/secret key 默认值、
        安装后输出的控制台/API/账号密码、netstat 端口占用检查、启动等待提示
  · 文档化未纳入（后续版本）：多服务指标对比、告警订阅、诊断包导出、
    SCM binPath 直接解析校验、远程主机服务
-->
<style>
  /* ===== 主题 Token（对齐 v2-theme.css，与首页/注册弹框/v1 同套） ===== */
  :root, [data-theme="light"], [data-theme="custom"] {
    --gn-bg-app:      rgb(246 246 244);
    --gn-bg-chrome:   rgb(236 236 234);
    --gn-bg-titlebar: rgb(250 250 248);
    --gn-bg-panel:    rgb(255 255 255);
    --gn-bg-panel-2:  rgb(250 250 248);
    --gn-bg-input:    rgb(255 255 255);
    --gn-bg-hover:    rgba(15, 23, 42, 0.045);
    --gn-bg-active:   rgba(15, 23, 42, 0.075);
    --gn-bg-selected: color-mix(in srgb, var(--gn-accent) 14%, transparent);
    --gn-fg-1: #0c1322; --gn-fg-2: #1f2937; --gn-fg-3: #4b5563;
    --gn-fg-4: #6b7280; --gn-fg-5: #9ca3af;
    --gn-br-1: rgba(15, 23, 42, 0.08);
    --gn-br-2: rgba(15, 23, 42, 0.12);
    --gn-br-3: rgba(15, 23, 42, 0.18);
    --gn-accent:       #15803d;
    --gn-accent-2:     #166534;
    --gn-accent-soft:  color-mix(in srgb, var(--gn-accent) 16%, var(--gn-bg-panel));
    --gn-accent-strong: #15803d;
    --gn-accent-strong-hover: #126634;
    --gn-on-accent: #ffffff;
    --gn-info:  #0369a1;
    --gn-warn:  #d97706;
    --gn-danger: #dc2626;
    --gn-shadow-md:  0 4px 14px rgba(15, 23, 42, 0.08);
    --gn-shadow-lg:  0 12px 40px rgba(15, 23, 42, 0.14);
    --gn-shadow-card: 0 0 0 0.5px rgba(15, 23, 42, 0.10), 0 1px 3px rgba(15, 23, 42, 0.06);
    --gn-font-sans: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    --gn-font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  [data-theme="custom"] {
    --gn-accent: #6d28d9; --gn-accent-2: #5b21b6;
    --gn-accent-soft: color-mix(in srgb, var(--gn-accent) 14%, var(--gn-bg-panel));
    --gn-accent-strong: #6d28d9; --gn-accent-strong-hover: #5b21b6;
  }
  [data-theme="dark"] {
    --gn-bg-app:      rgb(12 14 18);
    --gn-bg-chrome:   rgb(20 23 28);
    --gn-bg-titlebar: rgb(27 31 39);
    --gn-bg-panel:    rgb(22 26 33);
    --gn-bg-panel-2:  rgb(27 31 39);
    --gn-bg-input:    rgb(15 18 23);
    --gn-bg-hover:    rgba(255, 255, 255, 0.05);
    --gn-bg-active:   rgba(255, 255, 255, 0.08);
    --gn-bg-selected: color-mix(in srgb, var(--gn-accent) 18%, transparent);
    --gn-fg-1: #ffffff; --gn-fg-2: #f5f5f5; --gn-fg-3: #e6e6e6;
    --gn-fg-4: #d9d9d9; --gn-fg-5: #cccccc;
    --gn-br-1: rgba(255, 255, 255, 0.06);
    --gn-br-2: rgba(255, 255, 255, 0.10);
    --gn-br-3: rgba(255, 255, 255, 0.16);
    --gn-accent: #22c55e; --gn-accent-2: #16a34a;
    --gn-accent-soft: color-mix(in srgb, var(--gn-accent) 22%, transparent);
    --gn-accent-strong: #15803d; --gn-accent-strong-hover: #126634;
    --gn-info: #38bdf8; --gn-warn: #f59e0b; --gn-danger: #f87171;
    --gn-shadow-md:  0 4px 14px rgba(0, 0, 0, 0.45);
    --gn-shadow-lg:  0 12px 40px rgba(0, 0, 0, 0.55);
    --gn-shadow-card: 0 0 0 0.5px rgba(255, 255, 255, 0.08), 0 1px 3px rgba(0, 0, 0, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--gn-font-sans); background: var(--gn-bg-app); color: var(--gn-fg-1); font-size: 13px; overflow: hidden; }
  svg.ic { width: 16px; height: 16px; display: block; }
  button { font-family: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: var(--gn-fg-1); }
  .mono { font-family: var(--gn-font-mono); }

  .app { display: flex; flex-direction: column; height: 100vh; min-width: 1120px; }

  /* ===== 48px 标题栏 ===== */
  .titlebar {
    height: 48px; flex-shrink: 0;
    display: flex; align-items: center;
    background: var(--gn-bg-titlebar);
    border-bottom: 1px solid var(--gn-br-1);
    padding-left: 11px; user-select: none;
  }
  .brandlogo { width: 34px; height: 34px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--gn-fg-4); flex-shrink: 0; }
  .brandlogo .bl-logo { width: 20px; height: 20px; display: block; }
  .tdivider { width: 1px; height: 20px; background: var(--gn-br-2); margin: 0 6px; flex-shrink: 0; }
  .ghostbtn { height: 32px; padding: 0 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--gn-fg-3); white-space: nowrap; }
  .ghostbtn:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .ghostbtn .ic { opacity: .85; width: 15px; height: 15px; }
  .spring { flex: 1 1 auto; min-width: 0; }
  .gear { width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--gn-fg-4); margin-right: 12px; }
  .gear:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .winbtns { display: flex; align-items: center; gap: 2px; padding-right: 6px; }
  .winbtn { width: 40px; height: 40px; color: var(--gn-fg-4); display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .winbtn::before { content: ""; position: absolute; inset: 5px; border-radius: 7px; transition: background-color .15s ease; }
  .winbtn:hover { color: var(--gn-fg-1); }
  .winbtn:hover::before { background: var(--gn-bg-hover); }
  .winbtn.close:hover { color: #fff; }
  .winbtn.close:hover::before { background: #e81123; }
  .winbtn .ic { position: relative; }

  /* ===== 主体 ===== */
  .wbody { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 292px; flex-shrink: 0;
    background: var(--gn-bg-panel);
    border-right: 1px solid var(--gn-br-1);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sb-search { padding: 12px 12px 8px; }
  .sb-search-box {
    height: 30px; border-radius: 7px;
    background: var(--gn-bg-input); border: 1px solid var(--gn-br-2);
    display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--gn-fg-5);
  }
  .sb-search-box .ic { width: 14px; height: 14px; flex-shrink: 0; }
  .sb-search-box input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--gn-fg-1); }
  .sb-tree { flex: 1; overflow-y: auto; padding: 4px 8px 12px; user-select: none; }
  .tree-row {
    height: 30px; padding: 0 8px; border-radius: 6px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--gn-fg-2); cursor: pointer;
  }
  .tree-row:hover { background: var(--gn-bg-hover); }
  .tree-row.selected { background: var(--gn-bg-selected); color: var(--gn-fg-1); font-weight: 600; }
  .tree-row.opened { background: var(--gn-bg-hover); color: var(--gn-fg-1); font-weight: 600; }
  .tree-row .ic { width: 14px; height: 14px; color: var(--gn-fg-4); flex-shrink: 0; }
  .tree-row .cnt { margin-left: auto; font-family: var(--gn-font-mono); font-size: 11px; color: var(--gn-fg-5); }
  .tree-chev { width: 12px; height: 12px; transition: transform .15s ease; color: var(--gn-fg-5); flex-shrink: 0; }
  .tree-group.collapsed .tree-chev { transform: rotate(-90deg); }
  .tree-group.collapsed .tree-children { display: none; }
  .tree-children { margin: 1px 0 3px; }
  .tree-leaf { padding-left: 30px; font-weight: 400; }
  .leaf-ic { width: 14px; height: 14px; flex-shrink: 0; object-fit: contain; }
  .leaf-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .leaf-dot.run { background: var(--gn-accent); }
  .leaf-dot.stop { background: var(--gn-fg-5); opacity: .55; }
  .leaf-dot.pend { background: var(--gn-warn); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .leaf-state { margin-left: auto; font-size: 10.5px; color: var(--gn-fg-5); white-space: nowrap; }
  .sb-engine {
    flex-shrink: 0; border-top: 1px solid var(--gn-br-1);
    padding: 10px 14px; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--gn-fg-3); background: var(--gn-bg-panel-2);
  }
  .engine-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gn-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gn-accent) 18%, transparent); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--gn-accent) 10%, transparent); } }
  .sb-engine .ver { margin-left: auto; font-family: var(--gn-font-mono); font-size: 11px; color: var(--gn-fg-5); }

  /* ===== 主区（首页 / 详情 共用滚动容器） ===== */
  .main { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 22px 44px; }
  .view { display: flex; flex-direction: column; gap: 14px; }
  .view[hidden] { display: none; }

  /* ---------- 首页（服务总览） ---------- */
  .ph-head { display: flex; align-items: center; gap: 12px; }
  .ph-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .hint-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 10px; border-radius: 999px;
    background: var(--gn-accent-soft); color: var(--gn-accent-2);
    font-size: 11.5px; font-weight: 600;
  }
  .ph-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .ph-card { background: var(--gn-bg-panel); border-radius: 10px; box-shadow: var(--gn-shadow-card); padding: 14px 16px; }
  .ph-card .k { font-size: 11.5px; color: var(--gn-fg-4); }
  .ph-card .v { margin-top: 6px; font-family: var(--gn-font-mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ph-card .v small { font-size: 12px; font-weight: 500; color: var(--gn-fg-5); margin-left: 3px; }
  .ph-list { background: var(--gn-bg-panel); border-radius: 10px; box-shadow: var(--gn-shadow-card); padding: 6px 8px; }
  .ph-row { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--gn-fg-2); cursor: pointer; }
  .ph-row:hover { background: var(--gn-bg-hover); }
  .ph-row .go { margin-left: 4px; color: var(--gn-fg-5); opacity: 0; transition: opacity .12s ease; }
  .ph-row:hover .go { opacity: 1; }

  /* ============================================================ 详情页 */
  /* 返回导航 */
  .dt-nav { display: flex; align-items: center; gap: 8px; }
  .back-btn {
    height: 30px; padding: 0 12px 0 8px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 600; color: var(--gn-fg-3);
    border: 1px solid var(--gn-br-2); background: var(--gn-bg-panel);
  }
  .back-btn:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .back-btn .ic { width: 14px; height: 14px; }
  .crumbs { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--gn-fg-4); min-width: 0; }
  .crumbs .sep { color: var(--gn-fg-5); font-size: 10px; }
  .crumbs .cur { color: var(--gn-fg-1); font-weight: 700; font-family: var(--gn-font-mono); font-size: 12px; }
  .nav-sq {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--gn-br-2);
    display: inline-flex; align-items: center; justify-content: center; color: var(--gn-fg-4); background: var(--gn-bg-panel);
  }
  .nav-sq:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .nav-sq .ic { width: 14px; height: 14px; }

  /* Hero */
  .hero {
    position: relative;
    display: flex; align-items: flex-start; gap: 15px;
    padding: 17px 20px 16px 19px; border-radius: 13px;
    background: linear-gradient(115deg, color-mix(in srgb, var(--hc, #15803d) 9%, var(--gn-bg-panel)) 0%, var(--gn-bg-panel) 56%);
    border-left: 3px solid var(--hc, #15803d);
    box-shadow: var(--gn-shadow-card);
  }
  .hero-ico {
    width: 54px; height: 54px; border-radius: 14px; flex-shrink: 0;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--hc, #15803d) 13%, var(--gn-bg-panel));
    border: 1px solid color-mix(in srgb, var(--hc, #15803d) 26%, transparent);
  }
  .hero-ico img { width: 31px; height: 31px; object-fit: contain; }
  .hero-main { flex: 1; min-width: 0; }
  .hero-name { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .hero-name h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; }
  .hero-desc { margin-top: 6px; font-size: 12.5px; color: var(--gn-fg-3); line-height: 1.55; max-width: 780px; }
  .hero-meta { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--gn-fg-4); }
  .hero-meta .mono { color: var(--gn-fg-3); font-size: 11.5px; }
  .hero-meta .sep { color: var(--gn-fg-5); font-size: 10px; }
  .hero-acts { display: flex; align-items: center; gap: 6px; flex-shrink: 0; padding-top: 2px; }
  /* 高频生命周期（启停重启）与低频管理（注册/卸载）之间的视觉分隔 */
  .hero-sep { width: 1px; height: 20px; background: var(--gn-br-2); margin: 0 3px; flex-shrink: 0; }
  /* Hero 告警 pill：依赖端口异常时常驻可见，不让告警藏进悬浮层 */
  .hero-alert { height: 22px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--gn-warn); background: color-mix(in srgb, var(--gn-warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--gn-warn) 28%, transparent); }
  .hero-alert .ic { width: 12px; height: 12px; }

  /* 徽标 */
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge i { width: 6px; height: 6px; border-radius: 50%; }
  .badge.run { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .badge.run i { background: var(--gn-accent); animation: pulse 2.4s ease-in-out infinite; }
  .badge.stop { background: var(--gn-bg-hover); color: var(--gn-fg-4); }
  .badge.stop i { background: var(--gn-fg-5); }
  .badge.pend { background: color-mix(in srgb, var(--gn-warn) 14%, transparent); color: var(--gn-warn); }
  .badge.pend i { background: var(--gn-warn); animation: blink 1s ease-in-out infinite; }

  /* 按钮 */
  .btn {
    height: 33px; padding: 0 14px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; flex-shrink: 0;
    transition: opacity .12s ease, background-color .12s ease;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { border: 1px solid var(--gn-br-2); color: var(--gn-fg-2); background: var(--gn-bg-panel); }
  .btn-ghost:hover:not(:disabled) { background: var(--gn-bg-hover); }
  .btn-danger-o { border: 1px solid color-mix(in srgb, var(--gn-danger) 38%, transparent); color: var(--gn-danger); background: var(--gn-bg-panel); }
  .btn-danger-o:hover:not(:disabled) { background: color-mix(in srgb, var(--gn-danger) 8%, transparent); }
  .btn-primary { background: var(--gn-accent-strong); color: var(--gn-on-accent); box-shadow: var(--gn-shadow-md); }
  .btn-primary:hover:not(:disabled) { background: var(--gn-accent-strong-hover); }
  .btn .ic { width: 13.5px; height: 13.5px; }
  .btn-sm { height: 28px; padding: 0 11px; font-size: 11.5px; border-radius: 7px; }
  .btn-sm .ic { width: 12px; height: 12px; }

  /* 页签 */
  .dtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--gn-br-1); padding: 0 2px; }
  .dtab {
    height: 35px; padding: 0 14px; position: relative;
    font-size: 13px; font-weight: 600; color: var(--gn-fg-4);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dtab:hover { color: var(--gn-fg-1); }
  .dtab.on { color: var(--gn-fg-1); }
  .dtab.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--gn-accent); }
  .dtab .ic { width: 14px; height: 14px; opacity: .9; }
  .dot-badge {
    min-width: 16px; height: 16px; border-radius: 999px; padding: 0 4px;
    background: var(--gn-danger); color: #fff;
    font-size: 9.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .pane { display: flex; flex-direction: column; gap: 13px; }
  .sec-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--gn-fg-2); }
  .sec-title .live { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: var(--gn-accent-2); }
  .sec-title .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--gn-accent); animation: pulse 2s ease-in-out infinite; }
  .sec-title .sub { font-weight: 400; font-size: 11px; color: var(--gn-fg-5); }

  /* 资源卡 */
  .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .res-card { background: var(--gn-bg-panel); border-radius: 11px; box-shadow: var(--gn-shadow-card); padding: 13px 15px 12px; min-width: 0; display: flex; flex-direction: column; }
  .rc-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4); }
  .rc-head .ic { width: 14px; height: 14px; opacity: .85; flex-shrink: 0; }
  .rc-head .rc-tag { margin-left: auto; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--gn-bg-hover); color: var(--gn-fg-5); }
  .rc-head .rc-tag.warn { background: color-mix(in srgb, var(--gn-warn) 13%, transparent); color: var(--gn-warn); }
  .rc-val {
    margin-top: 9px; font-family: var(--gn-font-mono); font-size: 25px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1;
    display: flex; align-items: baseline; gap: 3px;
  }
  .rc-val small { font-size: 11.5px; font-weight: 500; color: var(--gn-fg-5); }
  .rc-val.mute { color: var(--gn-fg-5); font-size: 20px; }
  .rc-spark { margin-top: 9px; height: 28px; }
  .rc-spark svg { display: block; width: 100%; height: 28px; }
  .rc-note { margin-top: auto; padding-top: 8px; font-size: 10.5px; color: var(--gn-fg-5); font-family: var(--gn-font-mono); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  /* 事件摘要卡（资源区第 8 格）：两行截断，点击跳转事件页签 */
  .rc-evt { margin-top: 9px; font-size: 12.5px; line-height: 1.6; color: var(--gn-fg-1); font-weight: 500; font-family: var(--gn-font-sans); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .res-card.clickable { cursor: pointer; }
  .res-card.clickable:hover { box-shadow: var(--gn-shadow-md); }
  .res-card.clickable .rc-note b { color: var(--gn-accent-2); font-weight: 600; }
  .rc-note b { color: var(--gn-fg-4); font-weight: 600; }
  .m-bar { margin-top: 10px; height: 5px; border-radius: 3px; background: var(--gn-bg-hover); overflow: hidden; }
  .m-bar i { display: block; height: 100%; border-radius: 3px; transition: width .6s ease; }
  .rc-duo { margin-top: 9px; display: flex; flex-direction: column; gap: 8px; }
  .duo-row { display: flex; align-items: center; gap: 7px; }
  .duo-row .dl { font-size: 11px; color: var(--gn-fg-4); width: 30px; flex-shrink: 0; }
  .duo-row .dv { font-family: var(--gn-font-mono); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .duo-row .du { font-size: 10.5px; color: var(--gn-fg-5); }
  .duo-row .dbar { margin-left: auto; width: 54px; height: 4px; border-radius: 2px; background: var(--gn-bg-hover); overflow: hidden; flex-shrink: 0; }
  .duo-row .dbar i { display: block; height: 100%; border-radius: 2px; }

  /* 面板 */
  .panel { background: var(--gn-bg-panel); border-radius: 11px; box-shadow: var(--gn-shadow-card); padding: 14px 16px; }
  .p-head { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .p-head h3 { font-size: 12.5px; font-weight: 700; color: var(--gn-fg-2); display: flex; align-items: center; gap: 8px; }
  .p-head h3 .sub { font-weight: 400; font-size: 11px; color: var(--gn-fg-5); }
  .p-head .h-act { margin-left: auto; display: flex; gap: 6px; }
  .legend { margin-left: auto; display: flex; gap: 15px; font-size: 11.5px; color: var(--gn-fg-4); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .lg-line { width: 14px; height: 2.5px; border-radius: 2px; }
  .legend b { font-family: var(--gn-font-mono); font-weight: 600; color: var(--gn-fg-2); }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-empty { height: 132px; display: grid; place-items: center; font-size: 12px; color: var(--gn-fg-5); }


  /* 只读键值清单（纳管信息）：单列，每行一个字段，与可编辑表单形成明确区分 */
  .kv-list { border: 1px solid var(--gn-br-1); border-radius: 9px; overflow: hidden; }
  .kv-row { display: flex; align-items: center; gap: 10px; padding: 8px 13px; font-size: 12px; border-bottom: 1px solid var(--gn-br-1); background: var(--gn-bg-panel-2); }
  .kv-row:nth-child(even) { background: transparent; }
  .kv-row:last-child { border-bottom: 0; }
  .kv-row .k { width: 100px; flex-shrink: 0; color: var(--gn-fg-4); }
  .kv-row .v { flex: 1; min-width: 0; }
  .kv-row .v { color: var(--gn-fg-1); font-family: var(--gn-font-mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv-row .v.sans { font-family: var(--gn-font-sans); font-size: 12px; }

  /* 托管状态卡 */
  .inst-card { display: flex; flex-direction: column; border-radius: 11px; padding: 13px 15px; }
  .inst-card .ic-row { display: flex; align-items: center; gap: 12px; }

  /* 运行中 / 转场中：部署参数锁定提示条（规则见 service-detail-state-rules.md §3.2） */
  .lock-bar {
    display: flex; align-items: center; gap: 11px;
    border-radius: 9px; padding: 10px 12px; margin-bottom: 12px;
    background: color-mix(in srgb, var(--gn-warn) 9%, var(--gn-bg-panel));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--gn-warn) 30%, transparent);
  }
  .lock-bar .lb-ic { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--gn-warn) 16%, transparent); color: var(--gn-warn); }
  .lock-bar .lb-ic .ic { width: 14px; height: 14px; }
  .lock-bar .lb-text { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--gn-fg-1); }
  .lock-bar .lb-text small { display: block; font-weight: 400; font-size: 11px; color: var(--gn-fg-4); margin-top: 2px; line-height: 1.5; }
  .inst-card.ok { background: color-mix(in srgb, var(--gn-accent) 8%, var(--gn-bg-panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gn-accent) 30%, transparent); }
  .inst-card.info { background: color-mix(in srgb, var(--gn-info) 8%, var(--gn-bg-panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gn-info) 30%, transparent); }
  .inst-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
  .inst-card.ok .inst-ic { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .inst-card.info .inst-ic { background: color-mix(in srgb, var(--gn-info) 14%, transparent); color: var(--gn-info); }
  .inst-ic .ic { width: 17px; height: 17px; }
  .inst-txt { min-width: 0; flex: 1; }
  .inst-txt b { font-size: 12.5px; color: var(--gn-fg-1); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .inst-txt small { display: block; margin-top: 3px; font-size: 11px; color: var(--gn-fg-4); line-height: 1.55; }

  /* 步骤条 */
  .steps { display: none; flex-direction: column; margin-top: 12px; border-top: 1px dashed var(--gn-br-2); padding-top: 12px; }
  .steps.show { display: flex; }
  .step { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; color: var(--gn-fg-4); }
  .step .s-ic { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; background: var(--gn-bg-hover); color: var(--gn-fg-5); font-size: 10.5px; font-weight: 700; }
  .step .s-ic .ic { width: 11px; height: 11px; }
  .step.doing .s-ic { background: color-mix(in srgb, var(--gn-info) 15%, transparent); color: var(--gn-info); }
  .step.doing { color: var(--gn-fg-1); font-weight: 600; }
  .step.done .s-ic { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .step.warn .s-ic { background: color-mix(in srgb, var(--gn-warn) 15%, transparent); color: var(--gn-warn); }
  .step .s-sub { margin-left: auto; font-size: 11px; color: var(--gn-fg-5); font-family: var(--gn-font-mono); }
  .spin { animation: rot .9s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* 表单 */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.span2 { grid-column: span 2; }
  .field label { font-size: 11.5px; font-weight: 600; color: var(--gn-fg-2); display: flex; align-items: center; gap: 6px; }
  .field label .hint { font-weight: 400; color: var(--gn-fg-5); font-size: 10.5px; }
  /* JVM 常用参数快捷开关：布尔类参数点击追加 / 移除，激活态跟随输入框内容 */
  .jvm-presets .preset-chips { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 7px; }
  .preset-chip { height: 24px; padding: 0 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-3); border: 1px solid var(--gn-br-2); background: var(--gn-bg-panel-2); transition: all .12s ease; }
  .preset-chip:hover { border-color: var(--gn-accent); color: var(--gn-fg-1); }
  .preset-chip.on { background: var(--gn-accent-soft); border-color: color-mix(in srgb, var(--gn-accent) 42%, transparent); color: var(--gn-accent-2); }
  .preset-chip:disabled { opacity: .45; cursor: not-allowed; }
  /* 堆内存单选行 / 开关多选行的分组标签 */
  .preset-row { display: flex; align-items: center; gap: 9px; margin-top: 7px; }
  .preset-row:first-of-type { margin-top: 2px; }
  .preset-label { width: 52px; flex-shrink: 0; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4); }
  /* 启动类型分段选择（与添加服务弹窗同构）：紧凑灰底容器，选中项滑块填充主题色
     （真实实现用 antd Segmented，选中底色取 --gn-accent，滑块位移随选项） */
  .seg-group { display: inline-flex; align-self: flex-start; background: var(--gn-bg-hover); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg-btn { height: 22px; padding: 0 10px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--gn-fg-4); white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
  .seg-btn:hover:not(:disabled):not(.on) { color: var(--gn-fg-1); }
  .seg-btn.on { background: var(--gn-accent); color: var(--gn-on-accent); }
  .seg-btn:disabled { opacity: .5; cursor: not-allowed; }
  /* 堆内存拖拽滑杆 + 数值输入框：拖动吸附档位，也可直接键入（回车 / 失焦提交）；
     上限 = 自动检测的本机可用内存（HOST_MEM_GB × 75%，见 HEAP_MAX_GB），超出机器内存的堆设置无意义。
     滑杆定宽，避免在双列表单里被拉成通栏 */
  input.heap-range { -webkit-appearance: none; appearance: none; width: 210px; height: 16px; background: transparent; cursor: pointer; margin: 0; flex-shrink: 0; }
  input.heap-range::-webkit-slider-runnable-track { height: 5px; border-radius: 999px; background: linear-gradient(to right, var(--gn-accent) var(--fill, 0%), var(--gn-bg-active) var(--fill, 0%)); }
  input.heap-range::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--gn-bg-panel); border: 2px solid var(--gn-accent); box-shadow: var(--gn-shadow-card); margin-top: -4px; transition: transform .12s ease; }
  input.heap-range:active:not(:disabled)::-webkit-slider-thumb { transform: scale(1.2); }
  input.heap-range::-moz-range-track { height: 5px; border-radius: 999px; background: var(--gn-bg-active); }
  input.heap-range::-moz-range-progress { height: 5px; border-radius: 999px; background: var(--gn-accent); }
  input.heap-range::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: var(--gn-bg-panel); border: 2px solid var(--gn-accent); box-shadow: var(--gn-shadow-card); }
  input.heap-range:disabled { opacity: .45; cursor: not-allowed; }
  input.heap-range:disabled::-webkit-slider-thumb { border-color: var(--gn-fg-5); }
  .input.heap-input { width: 78px; height: 26px; border-radius: 6px; flex-shrink: 0; }
  .input.heap-input input { text-align: center; font-size: 11.5px; }
  .heap-cap { flex-shrink: 0; font-size: 10.5px; color: var(--gn-fg-5); font-family: var(--gn-font-mono); white-space: nowrap; }
  .input { height: 31px; border-radius: 7px; background: var(--gn-bg-input); border: 1px solid var(--gn-br-2); display: flex; align-items: center; padding: 0 9px; font-size: 12px; min-width: 0; transition: border-color .12s ease, box-shadow .12s ease; }
  .input input, .input select { flex: 1; border: 0; outline: 0; background: transparent; font-size: 12px; min-width: 0; }
  .input input.mono { font-family: var(--gn-font-mono); }
  .input:focus-within { border-color: var(--gn-accent); box-shadow: 0 0 0 3px var(--gn-accent-soft); }
  .input select { appearance: auto; cursor: pointer; }
  /* 锁定态：输入框 / 下拉 / 开关 */
  .input.locked { background: var(--gn-bg-hover); border-color: var(--gn-br-1); }
  .input.locked input, .input.locked select { color: var(--gn-fg-4); cursor: not-allowed; }
  .input.locked:focus-within { border-color: var(--gn-br-1); box-shadow: none; }
  /* 输入框内的就地操作按钮（如「打开工作目录」），随字段走而非另设入口 */
  .input .in-act { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--gn-fg-4); margin-right: -4px; }
  .input .in-act:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .input .in-act .ic { width: 12.5px; height: 12.5px; }
  .input .in-act:disabled { opacity: .4; cursor: not-allowed; background: transparent; color: var(--gn-fg-5); }
  .switch:disabled { opacity: .45; cursor: not-allowed; }
  .chip:disabled { opacity: .5; cursor: not-allowed; }
  .switch-row { display: flex; align-items: center; gap: 8px; }
  .switch { width: 34px; height: 19px; border-radius: 999px; position: relative; background: var(--gn-bg-active); transition: background-color .15s ease; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s ease; }
  .switch.on { background: var(--gn-accent-strong); }
  .switch.on::after { transform: translateX(15px); }
  .sw-label { font-size: 12px; color: var(--gn-fg-2); font-weight: 600; }
  .sw-label small { font-weight: 400; color: var(--gn-fg-5); margin-left: 5px; }

  /* 命令预览 */
  .cmd-block { position: relative; margin-top: 12px; border-radius: 9px; overflow: hidden; box-shadow: 0 0 0 1px var(--gn-br-1); }
  .cmd-bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--gn-bg-panel-2); border-bottom: 1px solid var(--gn-br-1); }
  .cmd-bar .dots { display: flex; gap: 4px; }
  .cmd-bar .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--gn-br-3); }
  .cmd-bar .t { font-family: var(--gn-font-mono); font-size: 10.5px; color: var(--gn-fg-5); margin-left: 4px; }
  .cmd-bar .copy { margin-left: auto; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--gn-fg-4); display: inline-flex; align-items: center; gap: 4px; }
  .cmd-bar .copy:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .cmd-bar .copy .ic { width: 11.5px; height: 11.5px; }
  .cmd-body { background: var(--gn-bg-input); padding: 11px 13px; font-family: var(--gn-font-mono); font-size: 11px; line-height: 1.85; color: var(--gn-fg-2); overflow: auto; max-height: 200px; }
  .cmd-body .flag { color: var(--gn-accent-2); }
  .cmd-body .cont { color: var(--gn-fg-5); }


  /* 配置文件 */
  .conf-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conf-head .cf-name { font-family: var(--gn-font-mono); font-size: 12.5px; font-weight: 700; color: var(--gn-fg-1); }
  .conf-head .cf-path { font-family: var(--gn-font-mono); font-size: 10.5px; color: var(--gn-fg-5); }
  .conf-head .cf-mode { margin-left: auto; }
  .seg { display: inline-flex; background: var(--gn-bg-hover); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { height: 24px; padding: 0 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4); white-space: nowrap; }
  .seg button:hover { color: var(--gn-fg-1); }
  .seg button.on { background: var(--gn-bg-panel); color: var(--gn-fg-1); box-shadow: var(--gn-shadow-md); }
  .conf-body textarea { width: 100%; min-height: 190px; resize: vertical; margin-top: 10px; background: var(--gn-bg-input); border: 1px solid var(--gn-br-2); border-radius: 8px; padding: 11px 13px; outline: 0; font-family: var(--gn-font-mono); font-size: 11.5px; line-height: 1.85; color: var(--gn-fg-2); }
  .conf-body textarea:focus { border-color: var(--gn-accent); box-shadow: 0 0 0 3px var(--gn-accent-soft); }
  .conf-foot { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .conf-foot .hint { flex: 1; font-size: 11px; color: var(--gn-fg-5); line-height: 1.55; }
  .conf-foot .hint b { color: var(--gn-fg-4); font-weight: 600; }
  .restart-bar { display: none; align-items: center; gap: 10px; border-radius: 11px; padding: 11px 14px; background: color-mix(in srgb, var(--gn-warn) 9%, var(--gn-bg-panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gn-warn) 35%, transparent); }
  .restart-bar.show { display: flex; }
  .restart-bar .rb-ic { width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--gn-warn) 16%, transparent); color: var(--gn-warn); }
  .restart-bar .rb-ic .ic { width: 13px; height: 13px; }
  .restart-bar .rb-text { font-size: 12.5px; font-weight: 600; color: var(--gn-fg-1); }
  .restart-bar .rb-text small { display: block; font-weight: 400; font-size: 11px; color: var(--gn-fg-4); margin-top: 1px; }
  .restart-bar .rb-actions { margin-left: auto; display: flex; gap: 8px; }

  /* 日志 */
  .chip { height: 26px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--gn-br-2); display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4); white-space: nowrap; }
  .chip:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .chip.on { background: var(--gn-bg-selected); border-color: transparent; color: var(--gn-accent-2); }
  .chip .ic { width: 12px; height: 12px; }
  .log-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .log-files { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .log-file { flex-shrink: 0; border-radius: 8px; padding: 7px 11px; text-align: left; background: var(--gn-bg-panel-2); border: 1px solid transparent; }
  .log-file:hover { background: var(--gn-bg-hover); }
  .log-file.on { border-color: color-mix(in srgb, var(--gn-accent) 45%, transparent); background: var(--gn-accent-soft); }
  .log-file .f-name { font-family: var(--gn-font-mono); font-size: 11px; font-weight: 700; color: var(--gn-fg-1); display: flex; align-items: center; gap: 5px; }
  .log-file .f-meta { margin-top: 2px; font-size: 10px; color: var(--gn-fg-5); font-family: var(--gn-font-mono); }
  .log-file .f-rot { font-size: 9px; padding: 0 4px; border-radius: 4px; background: var(--gn-bg-hover); color: var(--gn-fg-5); font-weight: 600; }
  .log-view { background: var(--gn-bg-input); border-radius: 10px; box-shadow: 0 0 0 1px var(--gn-br-1); padding: 11px 13px; font-family: var(--gn-font-mono); font-size: 11px; line-height: 1.9; color: var(--gn-fg-3); height: 340px; overflow-y: auto; }
  .log-view .lg-t { color: var(--gn-fg-5); margin-right: 9px; }
  .log-view .lg-lv { display: inline-block; width: 46px; font-weight: 700; }
  .log-view .lg-info .lg-lv { color: var(--gn-info); }
  .log-view .lg-warn .lg-lv { color: var(--gn-warn); }
  .log-view .lg-error .lg-lv { color: var(--gn-danger); }
  .log-view .lg-error { color: var(--gn-fg-2); }

  /* 事件 */
  .event { display: flex; gap: 10px; position: relative; padding-bottom: 14px; }
  .event:last-child { padding-bottom: 2px; }
  .event::before { content: ""; position: absolute; left: 4px; top: 14px; bottom: -2px; width: 1px; background: var(--gn-br-1); }
  .event:last-child::before { display: none; }
  .e-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--gn-bg-panel); }
  .e-dot.run { background: var(--gn-accent); }
  .e-dot.warn { background: var(--gn-warn); }
  .e-dot.err { background: var(--gn-danger); }
  .e-dot.info { background: var(--gn-info); }
  .e-dot.stop { background: var(--gn-fg-5); }
  .e-time { width: 100px; flex-shrink: 0; font-family: var(--gn-font-mono); font-size: 11px; color: var(--gn-fg-5); padding-top: 1.5px; }
  .e-body { font-size: 12.5px; color: var(--gn-fg-3); line-height: 1.45; min-width: 0; }
  .e-body b { color: var(--gn-fg-1); font-weight: 600; }
  .e-body .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; vertical-align: 1px; }
  .tag.err { background: color-mix(in srgb, var(--gn-danger) 12%, transparent); color: var(--gn-danger); }
  .tag.warn { background: color-mix(in srgb, var(--gn-warn) 14%, transparent); color: var(--gn-warn); }
  .tag.ok { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .tag.info { background: color-mix(in srgb, var(--gn-info) 12%, transparent); color: var(--gn-info); }

  /* 空态 */
  .empty { border-radius: 11px; padding: 30px 18px; text-align: center; background: var(--gn-bg-panel); box-shadow: var(--gn-shadow-card); }
  .empty .ic { width: 26px; height: 26px; margin: 0 auto 8px; color: var(--gn-fg-5); }
  .empty b { display: block; font-size: 12.5px; color: var(--gn-fg-2); }
  .empty p { margin-top: 5px; font-size: 11.5px; color: var(--gn-fg-5); line-height: 1.6; }

  /* 弹窗 / Toast / 主题 dock */
  .modal-mask { position: fixed; inset: 0; z-index: 80; background: rgba(15, 23, 42, 0.34); display: none; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { width: 400px; border-radius: 14px; overflow: hidden; background: var(--gn-bg-panel); box-shadow: var(--gn-shadow-lg), 0 0 0 1px var(--gn-br-1); animation: pop .16s ease; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .modal .m-body { padding: 18px 18px 4px; display: flex; gap: 12px; }
  .modal .m-ic { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--gn-danger) 12%, transparent); color: var(--gn-danger); }
  .modal .m-ic.info { background: color-mix(in srgb, var(--gn-info) 12%, transparent); color: var(--gn-info); }
  .modal .m-ic .ic { width: 17px; height: 17px; }
  .modal h4 { font-size: 13.5px; font-weight: 700; color: var(--gn-fg-1); }
  .modal .m-txt { margin-top: 5px; font-size: 12px; color: var(--gn-fg-3); line-height: 1.65; }
  .modal .m-txt code { font-family: var(--gn-font-mono); font-size: 11px; background: var(--gn-bg-hover); padding: 1px 5px; border-radius: 4px; }
  .modal .m-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px 16px; }

  /* JDK 选择器（JVM 路径字段的就地选择） */
  .jd-head { padding: 16px 18px 13px; border-bottom: 1px solid var(--gn-br-1); }
  .jd-head h4 { font-size: 14px; font-weight: 700; color: var(--gn-fg-1); }
  .jd-head p { margin-top: 4px; font-size: 11.5px; color: var(--gn-fg-4); line-height: 1.55; }
  .jd-list { padding: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 268px; overflow-y: auto; }
  .jd-item { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 9px; text-align: left; border: 1px solid transparent; width: 100%; }
  .jd-item:hover { background: var(--gn-bg-hover); }
  .jd-item.on { border-color: color-mix(in srgb, var(--gn-accent) 45%, transparent); background: var(--gn-accent-soft); }
  .jd-radio { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--gn-br-3); flex-shrink: 0; position: relative; }
  .jd-item.on .jd-radio { border-color: var(--gn-accent); }
  .jd-item.on .jd-radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--gn-accent); }
  .jd-ver { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-family: var(--gn-font-mono); font-size: 12.5px; font-weight: 700; background: var(--gn-bg-hover); color: var(--gn-fg-3); }
  .jd-item.on .jd-ver { background: var(--gn-accent); color: var(--gn-on-accent); }
  .jd-main { flex: 1; min-width: 0; }
  .jd-name { font-size: 12.5px; font-weight: 600; color: var(--gn-fg-1); display: flex; align-items: center; gap: 7px; }
  .jd-path { margin-top: 1px; font-family: var(--gn-font-mono); font-size: 10.5px; color: var(--gn-fg-5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jd-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--gn-bg-hover); color: var(--gn-fg-5); flex-shrink: 0; }
  .jd-tag.cur { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .jd-manual { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--gn-br-1); background: var(--gn-bg-panel-2); }
  .jd-manual .jd-m-label { font-size: 11.5px; color: var(--gn-fg-4); flex-shrink: 0; }
  .jd-manual .input { flex: 1; min-width: 0; }
  .jd-empty { padding: 18px; text-align: center; font-size: 12px; color: var(--gn-fg-5); }
  .toast { position: fixed; left: 50%; bottom: 26px; z-index: 90; transform: translateX(-50%) translateY(8px); background: #101828; color: #f3f4f6; font-size: 12px; font-weight: 600; padding: 9px 16px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .theme-dock { position: fixed; right: 18px; bottom: 12px; z-index: 60; background: var(--gn-bg-panel); border-radius: 12px; box-shadow: var(--gn-shadow-lg), 0 0 0 1px var(--gn-br-2); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .theme-dock .td-tip { font-size: 10.5px; color: var(--gn-fg-5); letter-spacing: .02em; }
  .td-seg { display: flex; background: var(--gn-bg-hover); border-radius: 8px; padding: 3px; gap: 2px; }
  .td-seg button { height: 24px; padding: 0 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4); }
  .td-seg button:hover { color: var(--gn-fg-1); }
  .td-seg button.on { background: var(--gn-bg-panel); color: var(--gn-fg-1); box-shadow: var(--gn-shadow-md); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--gn-br-2); border-radius: 5px; border: 2.5px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

  const HOST_MEM_GB = 32;

  const heapNum = gb => { const mb = Math.round(gb * 1024); return mb % 1024 === 0 ? (mb / 1024) + 'g' : mb + 'm'; };

  function mkTrend(seed, v0, min, max, amp) {
    let s = 2166136261;
    for (let i = 0; i < seed.length; i++) { s ^= seed.charCodeAt(i); s = Math.imul(s, 16777619); }
    let st = s >>> 0;
    const r = () => { st |= 0; st = st + 0x6D2B79F5 | 0; let t = Math.imul(st ^ st >>> 15, 1 | st); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const a = [v0];
    for (let i = 1; i < 41; i++) { let v = a[i - 1] + (r() - 0.5) * amp; v = Math.max(min, Math.min(max, v)); a.push(v); }

          ['08:00:03', 'INFO', "Server hostname (bind-address): '*' port: 3306"],
          ['08:00:04', 'INFO', '/usr/sbin/mysqld: ready for connections.'],
        ],
        err: [['09-27 22:14', 'WARN', "Aborted connection 8821 to db:'oj' user:'oj' (Got timeout)"]],
      },
      conf: null,
      events: [
        { t: '09-25 16:03', d: 'info', html: '<b>mysql-local</b> 纳管为受管服务（仅监控，未托管注册）<span class="tag info">纳管</span>' },
        { t: '09-25 16:03', d: 'run', html: '<b>mysql-local</b> 检测到服务正在运行（PID 3392）<span class="tag ok">运行中</span>' },
      ],
    },
  };

  Object.values(SERVICES).forEach(s => {
    if (s.deploy && s.deploy.startType === undefined) s.deploy.startType = s.startType;
    const r = s.res;
    const k = s.name;
    r.trend = {
      cpu: mkTrend(k + 'c', r.cpu || 0.6, 0.2, Math.max(6, (r.cpu || 2) * 3), 1.1),
      mem: mkTrend(k + 'm', r.mem || 120, Math.max(8, (r.mem || 120) * .85), (r.mem || 120) * 1.18, Math.max(6, (r.mem || 120) * .035)),
      threads: mkTrend(k + 't', r.threads || 40, Math.max(4, (r.threads || 40) * .8), (r.threads || 40) * 1.15, Math.max(3, (r.threads || 40) * .05)),
      handles: mkTrend(k + 'h', r.handles || 300, (r.handles || 300) * .85, (r.handles || 300) * 1.12, Math.max(6, (r.handles || 300) * .03)),
      disk: mkTrend(k + 'd', r.diskR || .5, .1, Math.max(2, (r.diskR || 1) * 2.2), Math.max(.4, (r.diskR || 1) * .5)),
      net: mkTrend(k + 'n', r.netRx || 4, .5, Math.max(12, (r.netRx || 8) * 2), Math.max(2, (r.netRx || 8) * .4)),
    };
  });

  const TREE_GROUPS = [
    { id: 'g-java', name: 'Java', icon: 'java.svg' },
    { id: 'g-store', name: '存储', icon: 'rustfs.png' },
  ];
  const groupCollapsed = {};

  /* ================================================================ 运行状态 */
  const $ = id => document.getElementById(id);
  let current = null;        // 当前详情的服务名
  let view = 'home';         // home | detail
  let activeTab = 'overview';// overview | deploy | runtime | logs | events
  let logSel = 0;            // 日志页选中文件下标
  let confDirty = false;     // 配置页脏状态（跟随当前服务）
  let confMode = 'fields';

  const isPending = svc => !!svc._pending;
  const isRunning = svc => svc.state === 'Running';
  const canSample = svc => isRunning(svc) && !isPending(svc);
  /* 部署参数可编辑性（规则 service-detail-state-rules.md §3.2）：
     运行中一律锁定 —— 启动参数只在进程启动时读取，改了也不生效，
     而且改完必须「重新注册」，重新注册又要求先停止，形成死循环体验。 */
  const deployLockReason = svc => {
    if (isPending(svc)) return ['操作进行中，参数暂不可修改', '等待当前操作完成后即可编辑。'];
    if (isRunning(svc)) return ['服务运行中，启动参数不可修改', '启动参数仅在进程启动时读取。请先停止服务，修改后执行「重新注册」写回 SCM。'];
    return null;
  };
  const badgeCls = svc => isPending(svc) ? 'pend' : isRunning(svc) ? 'run' : 'stop';
  const stateText = svc => {
    if (svc._pending === 'starting') return '启动中…';
    if (svc._pending === 'stopping') return '停止中…';
    if (svc._pending === 'restarting') return '重启中…';
    if (svc._pending === 'installing') return '安装中…';
    if (svc._pending === 'uninstalling') return '卸载中…';
    return svc.state === 'Running' ? '运行中' : '已停止';
  };
  const nowLabel = () => {
    const d = new Date();
    return `今天 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  /* 数值展示工具（磁盘 MB/s、网络 KB/s 自适应换算） */
  const diskVal = v => v >= 1 ? v.toFixed(1) : Math.round(v * 1024);
  const diskUnit = v => v >= 1 ? 'MB/s' : 'KB/s';
  const netVal = v => v >= 1024 ? (v / 1024).toFixed(1) : Math.round(v);
  const netUnit = v => v >= 1024 ? 'MB/s' : 'KB/s';
  const pctOf = (a, b) => Math.min(100, Math.round(a / b * 100));
  function escHtml(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escAttr(x) { return escHtml(x).replace(/"/g, '&quot;'); }

  /* sparkline：把趋势数组画成迷你折线 */
  function spark(arr, color, w = 140, h = 28) {
    const min = Math.min(...arr), max = Math.max(...arr);
    const rng = (max - min) || 1;
    const pts = arr.map((v, i) => [i * w / (arr.length - 1), h - 3 - (v - min) / rng * (h - 6)]);
    const d = pts.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="${color}" opacity=".10"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  /* ================================================================ Toast / 复制 */
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
  }
  function copyText(text, tip) {
    const done = () => toast(tip || '已复制到剪贴板');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制'); }
      ta.remove();
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  document.querySelectorAll('.td-seg button').forEach(b => b.addEventListener('click', () => {
    document.body.dataset.theme = b.dataset.t;
    document.querySelectorAll('.td-seg button').forEach(x => x.classList.toggle('on', x === b));
  }));

  /* ================================================================ 左侧服务树 */
  function renderTree() {
    SERVICES['WEC-AI-PLATFORM']._gid = 'g-java';
    SERVICES['oj-gateway']._gid = 'g-java';
    SERVICES['rustfs-service']._gid = 'g-store';
    SERVICES['mysql-local']._gid = null;
    const byGroup = g => Object.values(SERVICES).filter(s => (g ? s._gid === g : !s._gid));

    let html = `<div class="tree-row ${view === 'home' ? 'selected' : ''}" data-home="1"><svg class="ic"><use href="#i-grid"/></svg>全部服务<span class="cnt">${Object.keys(SERVICES).length}</span></div>`;

    const leafHtml = s => `
      <div class="tree-row tree-leaf ${view === 'detail' && current === s.name ? 'selected' : (current === s.name ? 'opened' : '')}" data-svc="${s.name}" title="${s.name} · 双击打开详情">
        <img class="leaf-ic" src="${ICON_BASE + s.icon}" alt="" />
        <i class="leaf-dot ${isPending(s) ? 'pend' : isRunning(s) ? 'run' : 'stop'}"></i>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.display}</span>
        <span class="leaf-state">${stateText(s)}</span>
      </div>`;

    for (const g of TREE_GROUPS) {
      const list = byGroup(g.id);
      const col = groupCollapsed[g.id];
      html += `<div class="tree-group ${col ? 'collapsed' : ''}">
        <div class="tree-row" data-group="${g.id}">
          <svg class="tree-chev"><use href="#i-chev"/></svg>
          <img class="leaf-ic" src="${ICON_BASE + g.icon}" alt="" />${g.name}<span class="cnt">${list.length}</span>
        </div>
        <div class="tree-children">${list.map(leafHtml).join('')}</div>
      </div>`;
    }
    const un = byGroup(null);
    html += `<div class="tree-group" style="margin-top:8px">
      <div class="tree-row" data-group="__un">
        <svg class="tree-chev"><use href="#i-chev"/></svg>
        <svg class="ic"><use href="#i-grid"/></svg>未分组<span class="cnt">${un.length}</span>
      </div>
      <div class="tree-children">${un.map(leafHtml).join('')}</div>
    </div>`;
    $('sbTree').innerHTML = html;
  }

  /* 单击 = 选中；双击 = 打开详情（替换主区） */
  $('sbTree').addEventListener('click', e => {
    const home = e.target.closest('[data-home]');
    if (home) { current = null; backHome(); return; }
    const grp = e.target.closest('[data-group]');
    if (grp) { const id = grp.dataset.group; groupCollapsed[id] = !groupCollapsed[id]; grp.parentElement.classList.toggle('collapsed'); return; }
    const leaf = e.target.closest('[data-svc]');
    if (leaf) { current = leaf.dataset.svc; renderTree(); renderPhList(); }
  });
  $('sbTree').addEventListener('dblclick', e => {
    const leaf = e.target.closest('[data-svc]');
    if (leaf) { e.preventDefault(); openDetail(leaf.dataset.svc); }
  });

  /* ================================================================ 首页：服务列表 */
  function renderPhList() {
    const all = Object.values(SERVICES);
    const ph = $('phSvc');
    if (ph) ph.innerHTML = `${all.filter(isRunning).length}<small>运行 / 共 ${all.length}</small>`;
    $('phList').innerHTML = Object.values(SERVICES).map(s => `
      <div class="ph-row" data-svc="${s.name}" title="双击打开 ${s.name} 详情">
        <img class="leaf-ic" src="${ICON_BASE + s.icon}" alt="" />
        <b style="font-weight:600">${s.display}</b>
        <span class="mono" style="font-size:11px;color:var(--gn-fg-5)">${s.name} · ${s.type}</span>
        <span style="margin-left:auto" class="badge ${badgeCls(s)}"><i></i>${stateText(s)}</span>
        <svg class="ic go" style="width:14px;height:14px;transform:rotate(-90deg)"><use href="#i-chev"/></svg>
      </div>`).join('');
  }
  $('phList').addEventListener('click', e => {
    const row = e.target.closest('[data-svc]'); if (!row) return;
    current = row.dataset.svc; renderTree(); renderPhList();
  });
  $('phList').addEventListener('dblclick', e => {
    const row = e.target.closest('[data-svc]'); if (!row) return;
    openDetail(row.dataset.svc);
  });

  /* ================================================================ 视图切换（首页 ⇄ 服务详情） */
  function openDetail(name) {
    if (!SERVICES[name]) return;
    if (current !== name) { activeTab = 'overview'; logSel = 0; confDirty = false; confMode = 'fields'; }
    current = name;
    view = 'detail';
    $('viewHome').hidden = true;
    $('viewDetail').hidden = false;
    renderTree();
    renderDetail();
    $('main').scrollTop = 0;
  }
  function backHome() {
    view = 'home';
    $('viewDetail').hidden = true;
    $('viewHome').hidden = false;
    renderTree(); renderPhList();
    $('main').scrollTop = 0;
  }

  /* ================================================================ 详情页：骨架 */
  const TABS = [
    ['overview', 'i-chart', '概览'],
    ['deploy', 'i-rocket', '部署参数'],
    ['logs', 'i-conf', '日志'],
    ['events', 'i-clock', '事件'],
  ];

  function renderDetail() {
    const s = SERVICES[current];
    $('viewDetail').innerHTML = `
      ${detailNav(s)}
      <div id="dtHero"></div>
      ${detailTabs(s)}
      <div class="pane" id="dtPane"></div>`;
    renderHero(); renderPane();
  }
  function renderHero() { $('dtHero').innerHTML = detailHero(SERVICES[current]); }

  /* 返回导航 + 分组面包屑 + 上/下一个服务 */
  function detailNav(s) {
    const list = Object.keys(SERVICES);
    const i = list.indexOf(current);
    const prev = list[(i - 1 + list.length) % list.length];
    const next = list[(i + 1) % list.length];
    const gname = s._gid ? ((TREE_GROUPS.find(g => g.id === s._gid) || {}).name || '未分组') : '未分组';
    return `<div class="dt-nav">
      <button class="back-btn" id="btnBack"><svg class="ic"><use href="#i-back"/></svg>服务总览</button>
      <div class="crumbs">
        <span>${gname}</span><span class="sep">/</span><span class="cur">${escHtml(s.name)}</span>
      </div>
      <span class="spring"></span>
      <span style="font-size:11.5px;color:var(--gn-fg-5)">双击左侧服务可切换 · ESC 返回总览</span>
      <button class="nav-sq" id="btnPrev" title="上一个：${prev}"><svg class="ic"><use href="#i-up"/></svg></button>
      <button class="nav-sq" id="btnNext" title="下一个：${next}"><svg class="ic"><use href="#i-down"/></svg></button>
    </div>`;
  }

  /* Hero：服务身份 + 状态 + 主操作 */
  function detailHero(s) {
    const run = isRunning(s), pend = isPending(s);
    const reg = s.registered;
    /* ——— 操作可用性：唯一口径见 design/service-detail-state-rules.md §2 ———
       两条核心约束：
         1. 运行中不可「注册 / 卸载」—— 需改写 SCM 里的服务启动路径，运行中会被拒绝；
         2. 运行中不可改「部署参数」—— 启动参数只在进程启动时读取（见 paneDeploy）。
       转场中（busy）一律禁用。 */
    const busy = pend;
    const stopped = !run && !busy;
    const startOff = s.startType === 'Disabled';   // 启动类型「已禁用」时 SCM 拒绝启动
    const noStart = busy || run || startOff;
    const noStop = busy || !run;
    const noRegister = busy || !stopped;
    const noUninstall = busy || !reg || !stopped;
    const tip = {
      start: run ? '服务已在运行'
        : startOff ? '启动类型为「已禁用」，请先在部署参数中改为自动或手动'
        : '启动服务（servy-cli start）',
      stop: run ? '停止服务（servy-cli stop）' : '服务未在运行',
      restart: run ? '停止后重新启动' : '服务未在运行',
      register: busy ? '操作进行中，请稍候'
        : !stopped ? '请先停止服务再注册 —— 注册需改写 SCM 中的服务启动路径'
        : reg ? '按脚本 INSTALL 重新写回 SCM：停止 → 卸载旧注册 → 注册 → 启动'
        : '通过 servy 注册为 Windows 服务（脚本 INSTALL）：开机自启 + 守护重启 + 日志轮转',
      uninstall: busy ? '操作进行中，请稍候'
        : !reg ? '该服务未由 servy 托管，没有可卸载的注册信息'
        : !stopped ? '请先停止服务再卸载'
        : '停止并从 SCM 移除注册信息，文件与数据保留（脚本 UNINSTALL）',
    };
    /* Hero 只承担「身份 + 当前状态 + 生命周期命令」三件事：
       托管方式 / 启动类型 / 守护 / 依赖端口等精确状态由下方常驻状态条承担，
       此处不再重复成标签，把宽度留给五个命令。 */
    /* 依赖端口面板已删除，异常时 Hero 常驻告警 pill 是端口状态的唯一可见提示 */
    const badPorts = s.depsPorts.filter(p => !p.ok).length;
    /* meta 只放「运行态」信息；服务名见面包屑，配置类信息统一在「部署参数 → 纳管信息」 */
    const meta = [
      run && s.pid ? `PID <span class="mono" style="color:var(--gn-fg-1)">${s.pid}</span>` : '',
      run && s.uptime ? `已运行 ${s.uptime}` : '当前未运行',
      run && s.startedAt ? `启动于 ${s.startedAt}` : '',
    ].filter(Boolean).join('<span class="sep">·</span>');

    return `<div class="hero" style="--hc:${s.accent}">
      <span class="hero-ico"><img src="${ICON_BASE + s.icon}" alt=""/></span>
      <div class="hero-main">
        <div class="hero-name">
          <h1>${escHtml(s.display)}</h1>
          <span class="badge ${badgeCls(s)}"><i></i>${stateText(s)}</span>
          ${badPorts ? `<span class="hero-alert" title="部分依赖端口未监听，详见「部署参数」"><svg class="ic"><use href="#i-warn"/></svg>${badPorts} 个依赖端口异常</span>` : ''}
        </div>
        <p class="hero-desc">${escHtml(s.desc || '')}</p>
        <div class="hero-meta">${meta}</div>
      </div>
      <div class="hero-acts">
        <button class="btn ${!noStart ? 'btn-primary' : 'btn-ghost'}" data-act="start" ${noStart ? 'disabled' : ''} title="${tip.start}"><svg class="ic"><use href="#i-play"/></svg>启动</button>
        <button class="btn btn-ghost" data-act="stop" ${noStop ? 'disabled' : ''} title="${tip.stop}"><svg class="ic"><use href="#i-stop"/></svg>停止</button>
        <button class="btn btn-ghost" data-act="restart" ${noStop ? 'disabled' : ''} title="${tip.restart}"><svg class="ic"><use href="#i-restart"/></svg>重启</button>
        <span class="hero-sep"></span>
        <button class="btn btn-ghost" data-act="register" ${noRegister ? 'disabled' : ''} title="${tip.register}"><svg class="ic"><use href="#i-shield"/></svg>${reg ? '重新注册' : '注册'}</button>
        <button class="btn btn-danger-o" data-act="uninstall" ${noUninstall ? 'disabled' : ''} title="${tip.uninstall}"><svg class="ic"><use href="#i-trash"/></svg>卸载</button>
      </div>
    </div>`;
  }


  /* 页签 */
  function detailTabs(s) {
    return `<div class="dtabs">
      ${TABS.map(([id, ic, label]) => `
        <button class="dtab ${activeTab === id ? 'on' : ''}" data-tab="${id}">
          <svg class="ic"><use href="#${ic}"/></svg>${label}
          ${id === 'deploy' && confDirty && s.conf ? '<span class="dot-badge">1</span>' : ''}
        </button>`).join('')}
    </div>`;
  }

  function renderPane() {
    const s = SERVICES[current];
    const R = { overview: paneOverview, deploy: paneDeploy, logs: paneLogs, events: paneEvents };
    const host = $('dtPane');
    if (!host) return;
    host.innerHTML = R[activeTab](s);
    if (activeTab === 'overview') requestAnimationFrame(drawTrend);
    if (activeTab === 'logs') requestAnimationFrame(scrollLogBottom);
  }



  /* ---------------- 概览：资源占用 + 趋势 ---------------- */
  function paneOverview(s) {
    const run = canSample(s);
    const r = s.res;
    const memPct = pctOf(r.mem, r.memMax);
    const memHot = memPct >= 80;

    const ghost = (ic, label, note) => `
      <div class="res-card">
        <div class="rc-head"><svg class="ic"><use href="#${ic}"/></svg>${label}</div>
        <div class="rc-val mute">—</div>
        <div class="rc-note">${note}</div>
      </div>`;

    /* 第 8 格：最近事件（原「连续运行」卡的 时长/启动时刻/PID 与 Hero meta 全部重复，删除）；
       服务级信息，点击跳转事件页签。 */
    const latest = s.events[0];
    const latestText = latest ? latest.html.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim() : '暂无事件记录';
    const eventCard = `
      <div class="res-card clickable" data-goto="events" title="点击查看全部事件">
        <div class="rc-head"><svg class="ic"><use href="#i-clock"/></svg>最近事件</div>
        <div class="rc-evt">${escHtml(latestText.length > 52 ? latestText.slice(0, 52) + '…' : latestText)}</div>
        <div class="rc-note">${latest ? latest.t : '—'} · <b>查看全部</b></div>
      </div>`;

    const cards = run ? `
      <div class="res-card">
        <div class="rc-head"><svg class="ic"><use href="#i-cpu"/></svg>CPU 使用率</div>
        <div class="rc-val"><span id="rCpu">${r.cpu.toFixed(1)}</span><small>%</small></div>
        <div class="rc-spark">${spark(r.trend.cpu, 'var(--gn-accent)')}</div>
        <div class="rc-note"><b>1min</b> ${(r.cpu * 1.08).toFixed(1)}% · <b>峰值</b> ${Math.max(...r.trend.cpu).toFixed(1)}%</div>
      </div>
      <div class="res-card">
        <div class="rc-head"><svg class="ic"><use href="#i-mem"/></svg>内存占用${memHot ? '<span class="rc-tag warn">偏高</span>' : ''}</div>
        <div class="rc-val"><span id="rMem">${r.mem}</span><small>MB</small></div>
        <div class="m-bar"><i id="rMemBar" style="width:${memPct}%;background:${memHot ? 'var(--gn-warn)' : 'var(--gn-info)'}"></i></div>
        <div class="rc-note"><b>上限</b> ${r.memMax} MB · 已用 ${memPct}%</div>
      </div>
      <div class="res-card">
        <div class="rc-head"><svg class="ic"><use href="#i-thread"/></svg>线程数</div>
        <div class="rc-val"><span id="rThr">${r.threads}</span></div>
        <div class="rc-spark">${spark(r.trend.threads, 'var(--gn-info)')}</div>
        <div class="rc-note"><b>峰值</b> ${Math.round(Math.max(...r.trend.threads))} · 2s 采样</div>
      </div>
      <div class="res-card">
        <div class="rc-head"><svg class="ic"><use href="#i-layers"/></svg>句柄数</div>
        <div class="rc-val"><span id="rHnd">${r.handles.toLocaleString()}</span></div>
        <div class="rc-spark">${spark(r.trend.handles, 'var(--gn-info)')}</div>
        <div class="rc-note">Windows Handle Count</div>
      </div>
      <div class="res-card">
        <div class="rc-head"><svg class="ic"><use href="#i-disk"/></svg>磁盘 I/O</div>
        <div class="rc-duo">

      : ghost('i-cpu', 'CPU 使用率', '服务未运行')
        + ghost('i-mem', '内存占用', '服务未运行')

             <div class="rc-head"><svg class="ic"><use href="#i-folder"/></svg>${r.dirLabel}占用</div>
             <div class="rc-val">${r.dirUsed}<small>GB</small></div>

        + eventCard;

    return `
      <div class="sec-title">
        <svg class="ic" style="width:14px;height:14px;color:var(--gn-fg-4)"><use href="#i-activity"/></svg>
        资源占用 <span class="sub">· 进程级采样，每 2 秒 · 目录占用为 5 分钟统计</span>
        ${run ? '<span class="live"><i></i>实时</span>' : ''}
      </div>
      <div class="res-grid">${cards}</div>

      <div class="panel">
        <div class="p-head">
          <h3>资源趋势 · 近 30 分钟 <span class="sub">${run ? '每 2 秒采样' : '（服务未运行）'}</span></h3>

            <span><i class="lg-line" style="background:var(--gn-accent)"></i>CPU <b id="lgCpu">${run ? r.cpu.toFixed(1) + '%' : '—'}</b></span>
            <span><i class="lg-line" style="background:var(--gn-info)"></i>内存 <b id="lgMem">${run ? r.mem + ' MB' : '—'}</b></span>
            <span><i class="lg-line" style="background:var(--gn-warn)"></i>线程 <b id="lgThr">${run ? r.threads : '—'}</b></span>
          </div>
        </div>
        ${run
          ? '<div class="chart-wrap"><svg id="trendChart" viewBox="0 0 960 170" preserveAspectRatio="none" style="height:170px"></svg></div>'
          : '<div class="chart-empty">启动服务后开始采样（每 2 秒）</div>'}
      </div>`;
  }

  /* 概览趋势图（CPU / 内存 / 线程 三线，各自归一化，真实值见图例） */
  function drawTrend() {
    const svg = document.getElementById('trendChart');
    if (!svg) return;
    const s = SERVICES[current];
    const NS = 'http://www.w3.org/2000/svg';
    const W = 960, H = 170, L = 10, R = 10, T = 12, B = 22;
    const iw = W - L - R, ih = H - T - B;
    svg.innerHTML = '';
    const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); svg.appendChild(n); return n; };
    [0, .25, .5, .75, 1].forEach(f => el('line', { x1: L, y1: T + ih * f, x2: W - R, y2: T + ih * f, stroke: 'var(--gn-br-1)', 'stroke-dasharray': f ? '3 5' : '0', 'stroke-width': 1 }));
    [['-30m', 0], ['-20m', .25], ['-10m', .5], ['-5m', .75], ['now', 1]].forEach(([txt, f]) => {
      const t = el('text', { x: L + iw * f, y: H - 6, 'text-anchor': f === 0 ? 'start' : f === 1 ? 'end' : 'middle', fill: 'var(--gn-fg-5)', 'font-size': 10, 'font-family': 'var(--gn-font-mono)' });
      t.textContent = txt;
    });
    const tr = s.res.trend;
    /* 分带绘制：三条指标量级差异大，各自占 1/3 纵向带并在带内 min-max 归一，
       避免同时按最大值归一后全部贴在顶部。真实值见图例。 */
    const bands = [
      { arr: tr.cpu, color: 'var(--gn-accent)', from: 0.04, to: 0.30, fill: true },
      { arr: tr.mem, color: 'var(--gn-info)', from: 0.37, to: 0.63 },
      { arr: tr.threads, color: 'var(--gn-warn)', from: 0.70, to: 0.96 },
    ];
    /* 带边界淡虚线，帮助区分三条带 */
    bands.forEach(b => {
      const y1 = T + ih * b.from, y2 = T + ih * b.to;
      el('line', { x1: L, y1: y1, x2: W - R, y2: y1, stroke: b.color, 'stroke-width': 1, opacity: .16, 'stroke-dasharray': '4 6' });
      el('line', { x1: L, y1: y2, x2: W - R, y2: y2, stroke: b.color, 'stroke-width': 1, opacity: .16, 'stroke-dasharray': '4 6' });
    });
    bands.forEach(b => {
      const mn = Math.min(...b.arr), mx = Math.max(...b.arr);
      const rng = (mx - mn) || 1;
      const pts = b.arr.map((v, i) => {
        const t = (v - mn) / rng;                                   // 0 = 带内最低，1 = 带内最高
        const y = T + ih * (b.to - t * (b.to - b.from));            // 映射到本条带
        return [L + iw * i / (b.arr.length - 1), y];
      });
      const d = pts.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
      if (b.fill) {
        const yb = T + ih * b.to;
        el('path', { d: `${d} L ${W - R} ${yb} L ${L} ${yb} Z`, fill: b.color, opacity: .10 });
      }
      el('path', { d, fill: 'none', stroke: b.color, 'stroke-width': 1.7, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: .95 });
      const [ex, ey] = pts[pts.length - 1];
      el('circle', { cx: ex, cy: ey, r: 3, fill: b.color, stroke: 'var(--gn-bg-panel)', 'stroke-width': 1.5 });
    });
  }

  /* ---------------- 部署参数 ---------------- */
  function paneDeploy(s) {
    const d = s.deploy;
    const busy = isPending(s);
    const lock = deployLockReason(s);   // 非空 = 表单锁定
    const editable = !lock;

    /* 本卡只做「托管状态说明 + 安装进度反馈」；
       注册 / 卸载等动作统一收在顶部 Hero 的五个命令里，避免同一动作出现两个入口。 */
    const instCard = s.registered ? `
      <div class="inst-card ok">

            <small>已注册为 Windows 服务（开机自启 · 守护重启 · 日志轮转）。修改下方参数后回到顶部执行「重新注册」写回 SCM —— 对应脚本 INSTALL 的 停止 → 卸载旧注册 → 注册 → 启动。</small>
          </div>
        </div>
        <div class="steps" id="instSteps"></div>

        <div class="ic-row">

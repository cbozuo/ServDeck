<title>ServDeck 高保真 — 纳管服务详情抽屉（概览 / 部署 / 配置 / 日志 / 事件）</title>
<!--
  设计说明（对接 JavaServiceDeploy-servy-cli版本.bat 的 GUI 化）
  · 触发：双击左侧纳管服务树的服务节点 → 右侧滑出详情抽屉（本原型中单击也会打开，便于体验；
    真实实现建议仅双击触发，单击保持选中 —— ServiceTreeSidebar.tsx:235 已预留该接入点）
  · 形态：inspector 式右侧抽屉（无遮罩、不阻塞树操作），× / ESC 关闭
  · 页签与脚本映射：
      概览   ← 脚本 [4] Service Status + SampleServiceMetrics 实时指标
      部署   ← 脚本 [1] Install（依赖端口预检→清理旧服务→注册→启动 / INSTALL_CMD 命令）
               脚本 [5] Version Info（java -version / servy-cli version）
               脚本 [6] Uninstall（Y/N 确认）+ DEPS_PORTS 端口健康检查
      配置   ← 配置文件托管（字段 ↔ 原文双向编辑，保存 → 重启生效）
      日志   ← --stdout / --stderr / --enableSizeRotation（日志轮转文件管理）
      事件   ← 启停 / 崩溃守护重启 / 配置变更 / 依赖端口告警 / 注册卸载 时间线
  · 已纳入的扩展：崩溃守护状态与事件、服务自身+依赖端口健康、日志轮转文件管理、
    register（servy 注册）/ manage（纳管未注册）双模式差异态、待重启配置变更闭环
  · 文档化未纳入（后续版本）：多服务指标对比、告警订阅/通知、诊断包导出、
    SCM binPath 直接解析校验、远程主机服务
-->

  .info-row .v.sans { font-family: var(--gn-font-sans); }

  /* 安装状态卡 */
  .inst-card { display: flex; align-items: center; gap: 12px; border-radius: 10px; padding: 13px 15px; }
  .inst-card.ok { background: color-mix(in srgb, var(--gn-accent) 8%, var(--gn-bg-panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gn-accent) 30%, transparent); }
  .inst-card.info { background: color-mix(in srgb, var(--gn-info) 8%, var(--gn-bg-panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gn-info) 30%, transparent); }
  .inst-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
  .inst-card.ok .inst-ic { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .inst-card.info .inst-ic { background: color-mix(in srgb, var(--gn-info) 14%, transparent); color: var(--gn-info); }
  .inst-ic .ic { width: 17px; height: 17px; }
  .inst-txt { min-width: 0; flex: 1; }
  .inst-txt b { font-size: 12.5px; color: var(--gn-fg-1); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .inst-txt small { display: block; margin-top: 2px; font-size: 11px; color: var(--gn-fg-4); line-height: 1.5; }
  .inst-acts { display: flex; gap: 8px; flex-shrink: 0; }

  /* 安装步骤条 */
  .steps { display: none; flex-direction: column; gap: 0; margin-top: 12px; border-top: 1px dashed var(--gn-br-2); padding-top: 12px; }
  .steps.show { display: flex; }
  .step { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; color: var(--gn-fg-4); }
  .step .s-ic {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--gn-bg-hover); color: var(--gn-fg-5);
    font-size: 10.5px; font-weight: 700;
  }
  .step .s-ic .ic { width: 11px; height: 11px; }
  .step.doing .s-ic { background: color-mix(in srgb, var(--gn-info) 15%, transparent); color: var(--gn-info); }
  .step.doing { color: var(--gn-fg-1); font-weight: 600; }
  .step.done .s-ic { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .step.warn .s-ic { background: color-mix(in srgb, var(--gn-warn) 15%, transparent); color: var(--gn-warn); }
  .step .s-sub { margin-left: auto; font-size: 11px; color: var(--gn-fg-5); font-family: var(--gn-font-mono); }
  .spin { animation: rot 0.9s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* 表单 */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.span2 { grid-column: span 2; }
  .field label { font-size: 11.5px; font-weight: 600; color: var(--gn-fg-2); display: flex; align-items: center; gap: 6px; }
  .field label .hint { font-weight: 400; color: var(--gn-fg-5); font-size: 10.5px; }
  .input {
    height: 31px; border-radius: 7px;
    background: var(--gn-bg-input); border: 1px solid var(--gn-br-2);
    display: flex; align-items: center; padding: 0 9px; font-size: 12px; min-width: 0;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .input input, .input select { flex: 1; border: 0; outline: 0; background: transparent; font-size: 12px; min-width: 0; }
  .input input.mono { font-family: var(--gn-font-mono); }
  .input:focus-within { border-color: var(--gn-accent); box-shadow: 0 0 0 3px var(--gn-accent-soft); }
  .input select { appearance: auto; cursor: pointer; }
  .switch-row { display: flex; align-items: center; gap: 8px; }
  .switch {
    width: 34px; height: 19px; border-radius: 999px; position: relative;
    background: var(--gn-bg-active); transition: background-color .15s ease; flex-shrink: 0;
  }
  .switch::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s ease; }
  .switch.on { background: var(--gn-accent-strong); }
  .switch.on::after { transform: translateX(15px); }
  .sw-label { font-size: 12px; color: var(--gn-fg-2); font-weight: 600; }
  .sw-label small { font-weight: 400; color: var(--gn-fg-5); margin-left: 5px; }

  /* 命令预览 */
  .cmd-block { position: relative; margin-top: 10px; border-radius: 9px; overflow: hidden; box-shadow: 0 0 0 1px var(--gn-br-1); }
  .cmd-bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--gn-bg-panel-2); border-bottom: 1px solid var(--gn-br-1); }
  .cmd-bar .dots { display: flex; gap: 4px; }
  .cmd-bar .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--gn-br-3); }
  .cmd-bar .t { font-family: var(--gn-font-mono); font-size: 10.5px; color: var(--gn-fg-5); margin-left: 4px; }
  .cmd-bar .copy { margin-left: auto; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--gn-fg-4); display: inline-flex; align-items: center; gap: 4px; }
  .cmd-bar .copy:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .cmd-bar .copy .ic { width: 11.5px; height: 11.5px; }
  .cmd-body { background: var(--gn-bg-input); padding: 11px 13px; font-family: var(--gn-font-mono); font-size: 11px; line-height: 1.8; color: var(--gn-fg-2); overflow-x: auto; max-height: 180px; overflow-y: auto; }
  .cmd-body .flag { color: var(--gn-accent-2); }
  .cmd-body .cont { color: var(--gn-fg-5); }

  /* 依赖端口 */
  .port-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed var(--gn-br-1); font-size: 12px; }
  .port-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .port-row:first-of-type { padding-top: 10px; }
  .p-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-dot.ok { background: var(--gn-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gn-accent) 16%, transparent); }
  .p-dot.down { background: var(--gn-danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gn-danger) 16%, transparent); }
  .p-dot.chk { background: var(--gn-info); animation: blink .7s ease-in-out infinite; }
  .port-row .p-port { font-family: var(--gn-font-mono); font-weight: 700; color: var(--gn-fg-1); }
  .port-row .p-label { color: var(--gn-fg-4); }
  .port-row .p-state { margin-left: auto; font-size: 11px; font-weight: 600; }
  .port-row .p-state.ok { color: var(--gn-accent-2); }
  .port-row .p-state.down { color: var(--gn-danger); }

  /* 运行环境终端 */
  .term { background: var(--gn-bg-input); border-radius: 9px; box-shadow: 0 0 0 1px var(--gn-br-1); padding: 11px 13px; font-family: var(--gn-font-mono); font-size: 11px; line-height: 1.8; color: var(--gn-fg-2); }
  .term .cmdline { color: var(--gn-fg-4); user-select: none; }
  .term .cmdline b { color: var(--gn-accent-2); font-weight: 600; }
  .env-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--gn-br-1); font-size: 12px; color: var(--gn-fg-3); }
  .env-row .mono { color: var(--gn-fg-2); }

  /* 配置文件 */
  .conf-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conf-head .cf-name { font-family: var(--gn-font-mono); font-size: 12.5px; font-weight: 700; color: var(--gn-fg-1); }
  .conf-head .cf-path { font-family: var(--gn-font-mono); font-size: 10.5px; color: var(--gn-fg-5); }
  .conf-head .cf-mode { margin-left: auto; }
  .seg { display: inline-flex; background: var(--gn-bg-hover); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { height: 24px; padding: 0 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4); white-space: nowrap; }
  .seg button:hover { color: var(--gn-fg-1); }
  .seg button.on { background: var(--gn-bg-panel); color: var(--gn-fg-1); box-shadow: var(--gn-shadow-md); }
  .conf-body textarea {
    width: 100%; min-height: 200px; resize: vertical; margin-top: 10px;
    background: var(--gn-bg-input); border: 1px solid var(--gn-br-2); border-radius: 8px;
    padding: 11px 13px; outline: 0;
    font-family: var(--gn-font-mono); font-size: 11.5px; line-height: 1.85; color: var(--gn-fg-2);
  }
  .conf-body textarea:focus { border-color: var(--gn-accent); box-shadow: 0 0 0 3px var(--gn-accent-soft); }
  .conf-foot { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .conf-foot .hint { flex: 1; font-size: 11px; color: var(--gn-fg-5); line-height: 1.55; }
  .conf-foot .hint b { color: var(--gn-fg-4); font-weight: 600; }
  .restart-bar {
    display: none; align-items: center; gap: 10px;
    border-radius: 10px; padding: 11px 14px;
    background: color-mix(in srgb, var(--gn-warn) 9%, var(--gn-bg-panel));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--gn-warn) 35%, transparent);
  }
  .restart-bar.show { display: flex; }
  .restart-bar .rb-ic { width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--gn-warn) 16%, transparent); color: var(--gn-warn); }
  .restart-bar .rb-ic .ic { width: 13px; height: 13px; }
  .restart-bar .rb-text { font-size: 12.5px; font-weight: 600; color: var(--gn-fg-1); }
  .restart-bar .rb-text small { display: block; font-weight: 400; font-size: 11px; color: var(--gn-fg-4); margin-top: 1px; }
  .restart-bar .rb-actions { margin-left: auto; display: flex; gap: 8px; }
  .dot-badge {
    min-width: 16px; height: 16px; border-radius: 999px; padding: 0 4px;
    background: var(--gn-danger); color: #fff;
    font-size: 9.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* 日志 */
  .chip {
    height: 26px; padding: 0 11px; border-radius: 7px;
    border: 1px solid var(--gn-br-2);
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4);
    white-space: nowrap;
  }
  .chip:hover { background: var(--gn-bg-hover); color: var(--gn-fg-1); }
  .chip.on { background: var(--gn-bg-selected); border-color: transparent; color: var(--gn-accent-2); }
  .chip .ic { width: 12px; height: 12px; }
  .chip .errdot { color: var(--gn-danger); font-size: 9px; }
  .log-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .log-files { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .log-file {
    flex-shrink: 0; border-radius: 8px; padding: 7px 11px; text-align: left;
    background: var(--gn-bg-panel); box-shadow: var(--gn-shadow-card);
    border: 1px solid transparent;
  }
  .log-file:hover { background: var(--gn-bg-hover); }
  .log-file.on { border-color: color-mix(in srgb, var(--gn-accent) 45%, transparent); background: var(--gn-accent-soft); }
  .log-file .f-name { font-family: var(--gn-font-mono); font-size: 11px; font-weight: 700; color: var(--gn-fg-1); display: flex; align-items: center; gap: 5px; }
  .log-file .f-meta { margin-top: 2px; font-size: 10px; color: var(--gn-fg-5); font-family: var(--gn-font-mono); }
  .log-file .f-rot { font-size: 9px; padding: 0 4px; border-radius: 4px; background: var(--gn-bg-hover); color: var(--gn-fg-5); font-weight: 600; }
  .log-view {
    background: var(--gn-bg-input); border-radius: 10px;
    box-shadow: 0 0 0 1px var(--gn-br-1);
    padding: 11px 13px; font-family: var(--gn-font-mono); font-size: 11px;
    line-height: 1.9; color: var(--gn-fg-3);
    height: 320px; overflow-y: auto;
  }
  .log-view .lg-t { color: var(--gn-fg-5); margin-right: 9px; }
  .log-view .lg-lv { display: inline-block; width: 46px; font-weight: 700; }
  .log-view .lg-info .lg-lv { color: var(--gn-info); }
  .log-view .lg-warn .lg-lv { color: var(--gn-warn); }
  .log-view .lg-error .lg-lv { color: var(--gn-danger); }
  .log-view .lg-error { color: var(--gn-fg-2); }

  /* 事件时间线 */
  .event { display: flex; gap: 10px; position: relative; padding-bottom: 13px; }
  .event:last-child { padding-bottom: 2px; }
  .event::before { content: ""; position: absolute; left: 4px; top: 14px; bottom: -2px; width: 1px; background: var(--gn-br-1); }
  .event:last-child::before { display: none; }
  .e-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--gn-bg-panel); }

  .e-dot.warn { background: var(--gn-warn); }
  .e-dot.err { background: var(--gn-danger); }
  .e-dot.info { background: var(--gn-info); }
  .e-dot.stop { background: var(--gn-fg-5); }
  .e-time { width: 100px; flex-shrink: 0; font-family: var(--gn-font-mono); font-size: 11px; color: var(--gn-fg-5); padding-top: 1.5px; }
  .e-body { font-size: 12.5px; color: var(--gn-fg-3); line-height: 1.45; min-width: 0; }
  .e-body b { color: var(--gn-fg-1); font-weight: 600; }
  .e-body .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; vertical-align: 1px; }
  .tag.err { background: color-mix(in srgb, var(--gn-danger) 12%, transparent); color: var(--gn-danger); }
  .tag.warn { background: color-mix(in srgb, var(--gn-warn) 14%, transparent); color: var(--gn-warn); }
  .tag.ok { background: var(--gn-accent-soft); color: var(--gn-accent-2); }
  .tag.info { background: color-mix(in srgb, var(--gn-info) 12%, transparent); color: var(--gn-info); }

  /* 空态 */
  .empty { border-radius: 10px; padding: 26px 18px; text-align: center; background: var(--gn-bg-panel); box-shadow: var(--gn-shadow-card); }
  .empty .ic { width: 26px; height: 26px; margin: 0 auto 8px; color: var(--gn-fg-5); }

  .empty p { margin-top: 4px; font-size: 11.5px; color: var(--gn-fg-5); line-height: 1.6; }

  /* 确认弹窗 / Toast / 主题 dock */
  .modal-mask {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(15, 23, 42, 0.34);
    display: none; align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 400px; border-radius: 14px; overflow: hidden;
    background: var(--gn-bg-panel);
    box-shadow: var(--gn-shadow-lg), 0 0 0 1px var(--gn-br-1);
    animation: pop .16s ease;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .modal .m-body { padding: 18px 18px 4px; display: flex; gap: 12px; }
  .modal .m-ic { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--gn-danger) 12%, transparent); color: var(--gn-danger); }
  .modal .m-ic .ic { width: 17px; height: 17px; }
  .modal h4 { font-size: 13.5px; font-weight: 700; color: var(--gn-fg-1); }
  .modal .m-txt { margin-top: 5px; font-size: 12px; color: var(--gn-fg-3); line-height: 1.65; }
  .modal .m-txt code { font-family: var(--gn-font-mono); font-size: 11px; background: var(--gn-bg-hover); padding: 1px 5px; border-radius: 4px; }
  .modal .m-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px 16px; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; z-index: 90;
    transform: translateX(-50%) translateY(8px);
    background: #101828; color: #f3f4f6;
    font-size: 12px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .theme-dock {
    position: fixed; right: 18px; bottom: 12px; z-index: 60;
    background: var(--gn-bg-panel); border-radius: 12px;
    box-shadow: var(--gn-shadow-lg), 0 0 0 1px var(--gn-br-2);
    padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .theme-dock .td-tip { font-size: 10.5px; color: var(--gn-fg-5); letter-spacing: .02em; }
  .td-seg { display: flex; background: var(--gn-bg-hover); border-radius: 8px; padding: 3px; gap: 2px; }
  .td-seg button { height: 24px; padding: 0 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--gn-fg-4); }
  .td-seg button:hover { color: var(--gn-fg-1); }
  .td-seg button.on { background: var(--gn-bg-panel); color: var(--gn-fg-1); box-shadow: var(--gn-shadow-md); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--gn-br-2); border-radius: 5px; border: 2.5px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

    if (svc._pending === 'stopping') return '停止中…';
    if (svc._pending === 'restarting') return '重启中…';
    if (svc._pending === 'installing') return '安装中…';
    if (svc._pending === 'uninstalling') return '卸载中…';
    return svc.state === 'Running' ? '运行中' : '已停止';

  const isRunning = svc => svc.state === 'Running';

  }));

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function copyText(text, tip) {
    const done = () => toast(tip || '已复制到剪贴板');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制'); }
      ta.remove();
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  /* ================================================================ 树 */
  function renderTree() {
    const tree = $('sbTree');
    const byGroup = g => Object.values(SERVICES).filter(s => (g ? s._gid === g : !s._gid));
    SERVICES['WEC-AI-PLATFORM']._gid = 'g-java';
    SERVICES['oj-gateway']._gid = 'g-java';
    SERVICES['rustfs-service']._gid = 'g-store';
    SERVICES['mysql-local']._gid = null;

    let html = `<div class="tree-row ${current ? '' : 'selected'}"><svg class="ic"><use href="#i-grid"/></svg>全部服务<span class="cnt">${Object.keys(SERVICES).length}</span></div>`;

    const leafHtml = s => `
      <div class="tree-row tree-leaf ${current === s.name ? 'selected' : ''}" data-svc="${s.name}" title="${s.name} · 双击打开详情">
        <img class="leaf-ic" src="${ICON_BASE + s.icon}" alt="" />
        <i class="leaf-dot ${isPending(s) ? 'pend' : isRunning(s) ? 'run' : 'stop'}"></i>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.display}</span>
        <span class="leaf-state">${stateText(s)}</span>
      </div>`;

    for (const g of TREE_GROUPS) {
      const list = byGroup(g.id);
      const col = groupCollapsed[g.id];
      html += `<div class="tree-group ${col ? 'collapsed' : ''}">
        <div class="tree-row" data-group="${g.id}">
          <svg class="tree-chev"><use href="#i-chev"/></svg>
          <img class="leaf-ic" src="${ICON_BASE + g.icon}" alt="" />${g.name}<span class="cnt">${list.length}</span>
        </div>
        <div class="tree-children">${list.map(leafHtml).join('')}</div>
      </div>`;
    }
    const un = byGroup(null);
    html += `<div class="tree-group" style="margin-top:8px">
      <div class="tree-row" data-group="__un">
        <svg class="tree-chev"><use href="#i-chev"/></svg>
        <svg class="ic"><use href="#i-grid"/></svg>未分组<span class="cnt">${un.length}</span>
      </div>
      <div class="tree-children">${un.map(leafHtml).join('')}</div>
    </div>`;
    tree.innerHTML = html;
  }

  $('sbTree').addEventListener('click', e => {
    const grp = e.target.closest('[data-group]');
    if (grp) { const id = grp.dataset.group; groupCollapsed[id] = !groupCollapsed[id]; grp.parentElement.classList.toggle('collapsed'); return; }
    const leaf = e.target.closest('[data-svc]');
    if (leaf) openDrawer(leaf.dataset.svc);   // 原型：单击也打开（真实实现建议仅双击）

  function renderHead() {

    const subBits = [
      `<span class="badge ${badgeCls(s)}"><i></i>${stateText(s)}</span>`,
      `<span class="mono">${s.name}</span>`,
      isRunning(s) ? `<span>· 运行 ${s.uptime}</span>` : '',

      s.mode === 'register' ? '<span>· servy 托管</span>' : '<span>· 纳管（未托管）</span>',
    ];
    $('dwSub').innerHTML = subBits.filter(Boolean).join('');
    $('dwTip').textContent = isPending(s) ? '操作已提交，等待 Windows 服务控制器返回…' : '';

    const pend = isPending(s);
    $('btnStart').disabled = pend || isRunning(s);
    $('btnStart').className = 'btn ' + (isRunning(s) || pend ? 'btn-ghost' : 'btn-primary');
    $('btnStop').disabled = pend || !isRunning(s);
    $('btnRestart').disabled = pend || !isRunning(s);
  }

  /* 启动 / 停止 / 重启（模拟 ControlWindowsService） */
  function setState(svc, pending, finalState, eventHtml, after) {
    svc._pending = pending;
    renderHead(); renderTree(); renderPhList();
    if (current === svc.name && ['overview', 'deploy', 'events'].includes(activeTab)) renderBody();
    setTimeout(() => {
      svc._pending = null;
      if (finalState) svc.state = finalState;
      if (finalState === 'Running') { svc.pid = svc.pid || 1000 + Math.floor(Math.random() * 9000); svc.threads = svc.threads || 180; if (!svc.uptime) svc.uptime = '刚刚启动'; }
      if (finalState === 'Stopped') { svc.pid = null; svc.uptime = null; }
      if (eventHtml) svc.events.unshift({ t: nowLabel(), d: eventHtml.d, html: eventHtml.html });
      renderHead(); renderTree(); renderPhList();
      renderBody();
      if (after) after();
    }, eventHtml.delay || 1500);
  }
  const nowLabel = () => {
    const d = new Date();
    return `今天 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  $('btnStart').addEventListener('click', () => {
    const s = SERVICES[current];
    if (isPending(s) || isRunning(s)) return;
    setState(s, 'starting', 'Running', { d: 'run', html: `<b>${s.display}</b> 服务启动成功<span class="tag ok">启动</span>` });
  });
  $('btnStop').addEventListener('click', () => {
    const s = SERVICES[current];
    if (isPending(s) || !isRunning(s)) return;
    setState(s, 'stopping', 'Stopped', { d: 'stop', html: `<b>${s.display}</b> 服务已停止<span class="tag ok">停止</span>` });
  });
  $('btnRestart').addEventListener('click', () => {
    const s = SERVICES[current];
    if (isPending(s) || !isRunning(s)) return;
    setState(s, 'restarting', 'Running', { d: 'run', html: `<b>${s.display}</b> 服务重启完成<span class="tag ok">重启</span>` });
  });

    else if (b.dataset.act === 'uninstall') askUninstall(s);

    const d = s.deploy; if (!d) return 'sc query ' + s.name;
    if (s.type === 'java') return `"${d.javaPath}" ${d.jvmArgs} ${d.appArgs}`.trim();

  /* ================================================================ 页签 */

    if (activeTab === 'logs') scrollLogBottom();

  /* ---------------- 概览 ---------------- */
  function rOverview(s) {
    const run = isRunning(s) && !isPending(s);
    const m = s.metrics;
    const memPct = Math.min(100, Math.round(m.mem / m.memMax * 100));
    const memHot = memPct >= 80;
    const cards = run ? `
      <div class="metric-card">
        <div class="mc-label">CPU 使用率</div>
        <div class="mc-val"><span id="mCpu">${m.cpu.toFixed(1)}</span><small>%</small></div>
        <div class="m-bar"><i id="mCpuBar" style="width:${Math.min(100, m.cpu * 8)}%;background:var(--gn-accent)"></i></div>
      </div>
      <div class="metric-card">
        <div class="mc-label">内存占用 ${memHot ? '<span style="color:var(--gn-warn)">▎偏高</span>' : ''}</div>

        <div class="m-bar"><i id="mMemBar" style="width:${memPct}%;background:${memHot ? 'var(--gn-warn)' : 'var(--gn-info)'}"></i></div>
        <div class="mc-note">上限 ${m.memMax} MB · 已用 ${memPct}%</div>
      </div>
      <div class="metric-card">
        <div class="mc-label">线程数</div>
        <div class="mc-val"><span id="mThr">${s.threads}</span></div>
        <div class="mc-note">PID ${s.pid} · 2s 采样</div>
      </div>` : `
      <div class="metric-card"><div class="mc-label">CPU 使用率</div><div class="mc-val" style="color:var(--gn-fg-5)">—</div><div class="mc-note">服务未运行</div></div>
      <div class="metric-card"><div class="mc-label">内存占用</div><div class="mc-val" style="color:var(--gn-fg-5)">—</div><div class="mc-note">服务未运行</div></div>
      <div class="metric-card"><div class="mc-label">线程数</div><div class="mc-val" style="color:var(--gn-fg-5)">—</div><div class="mc-note">服务未运行</div></div>`;

    const d = s.deploy;
    const infoRows = `
      <div class="info-row"><span class="k">启动命令</span><span class="v" title="${escAttr(runCommand(s))}">${escHtml(runCommand(s))}</span></div>
      ${d ? `<div class="info-row"><span class="k">工作目录</span><span class="v">${escHtml(d.workDir)}</span></div>` : ''}
      <div class="info-row"><span class="k">启动类型</span><span class="v sans">${startTypeText(s.startType)}</span></div>
      <div class="info-row"><span class="k">进程守护</span><span class="v sans">${d && d.guard ? '异常退出自动重启' : '未启用'}</span></div>
      <div class="info-row"><span class="k">日志目录</span><span class="v" title="${d ? escAttr(d.logDir) : ''}">${d ? escHtml(d.logDir) : '（跟随系统安装器）'}</span></div>
      <div class="info-row"><span class="k">日志轮转</span><span class="v sans">${d && d.rotate ? '按大小轮转（stdout / stderr）' : '未启用'}</span></div>
      <div class="info-row"><span class="k">服务来源</span><span class="v sans">${s.registered ? 'servy 注册（本机）' : '纳管（未托管注册）'}</span></div>
      <div class="info-row"><span class="k">${s.registered ? '注册时间' : '纳管时间'}</span><span class="v sans">${s.addedAt}</span></div>`;

    return `
      <div class="metrics">${cards}</div>
      <div class="panel">
        <div class="p-head">
          <h3>资源趋势 · 近 30 分钟 <span class="sub">${run ? '' : '（服务未运行）'}</span></h3>
          <div class="legend">
            <span><i class="lg-line" style="background:var(--gn-accent)"></i>CPU <b id="lgCpu">${run ? m.cpu.toFixed(1) + '%' : '—'}</b></span>
            <span><i class="lg-line" style="background:var(--gn-info)"></i>内存 <b id="lgMem">${run ? m.mem + ' MB' : '—'}</b></span>
          </div>
        </div>
        ${run ? '<div class="chart-wrap"><svg id="trendChart" viewBox="0 0 640 150"></svg></div>' : '<div class="chart-empty">启动服务后开始采样（每 2 秒）</div>'}
      </div>
      <div class="panel">
        <div class="p-head"><h3>基本信息</h3></div>
        <div class="info-grid">${infoRows}</div>
      </div>`;
  }

  /* 概览趋势图 + 2s 指标轮询（模拟 SampleServiceMetrics） */
  function drawTrend() {
    const svg = document.getElementById('trendChart');
    if (!svg) return;
    const s = SERVICES[current];
    const NS = 'http://www.w3.org/2000/svg';
    const W = 640, H = 150, L = 8, R = 8, T = 10, B = 20;
    const iw = W - L - R, ih = H - T - B;
    svg.innerHTML = '';
    const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); svg.appendChild(n); return n; };
    [0, 0.5, 1].forEach(f => el('line', { x1: L, y1: T + ih * f, x2: W - R, y2: T + ih * f, stroke: 'var(--gn-br-1)', 'stroke-dasharray': '3 4' }));
    [['-30m', 0], ['-15m', .5], ['now', 1]].forEach(([txt, f]) => {
      const t = el('text', { x: L + iw * f, y: H - 5, 'text-anchor': f === 0 ? 'start' : f === 1 ? 'end' : 'middle', fill: 'var(--gn-fg-5)', 'font-size': 9.5, 'font-family': 'var(--gn-font-mono)' });
      t.textContent = txt;
    });
    const { cpu, mem } = s.metrics.trend;
    const toPath = (arr, max) => { const pts = arr.map((v, i) => [L + iw * i / (arr.length - 1), T + ih * (1 - v / max)]); return { d: pts.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' '), pts }; };
    const cpuMax = Math.max(8, Math.max(...cpu) * 1.35);
    const memMax = Math.max(...mem) * 1.15;
    const c = toPath(cpu, cpuMax), m2 = toPath(mem, memMax);
    el('path', { d: c.d + ` L ${W - R} ${T + ih} L ${L} ${T + ih} Z`, fill: 'var(--gn-accent)', opacity: 0.09 });
    el('path', { d: m2.d, fill: 'none', stroke: 'var(--gn-info)', 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: .9 });
    el('path', { d: c.d, fill: 'none', stroke: 'var(--gn-accent)', 'stroke-width': 1.8, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    const [ex, ey] = c.pts[c.pts.length - 1];
    el('circle', { cx: ex, cy: ey, r: 3, fill: 'var(--gn-accent)', stroke: 'var(--gn-bg-panel)', 'stroke-width': 1.5 });
    const [mx, my] = m2.pts[m2.pts.length - 1];
    el('circle', { cx: mx, cy: my, r: 3, fill: 'var(--gn-info)', stroke: 'var(--gn-bg-panel)', 'stroke-width': 1.5 });
  }

  setInterval(() => {
    if (!current || !$('drawer').classList.contains('open')) return;
    const s = SERVICES[current];
    if (!isRunning(s) || isPending(s)) return;
    const m = s.metrics;
    m.cpu = Math.max(0.4, Math.min(18, m.cpu + (Math.random() - 0.5) * 1.6));
    m.mem = Math.max(32, Math.round(Math.min(m.memMax, m.mem + (Math.random() - 0.5) * 18)));
    m.threads = Math.max(8, (s.threads || 100) + Math.round((Math.random() - 0.5) * 6));
    s.threads = m.threads;
    m.trend.cpu.push(m.cpu); m.trend.cpu.shift();
    m.trend.mem.push(m.mem); m.trend.mem.shift();
    if (activeTab !== 'overview') return;
    const cpuEl = $('mCpu'), memEl = $('mMem'), thrEl = $('mThr');
    if (!cpuEl) return;
    const memPct = Math.min(100, Math.round(m.mem / m.memMax * 100));
    cpuEl.textContent = m.cpu.toFixed(1);
    $('mCpuBar').style.width = Math.min(100, m.cpu * 8) + '%';
    memEl.textContent = m.mem;
    const memBar = $('mMemBar');
    memBar.style.width = memPct + '%';
    memBar.style.background = memPct >= 80 ? 'var(--gn-warn)' : 'var(--gn-info)';
    thrEl.textContent = m.threads;
    $('lgCpu').textContent = m.cpu.toFixed(1) + '%';
    $('lgMem').textContent = m.mem + ' MB';
    drawTrend();
  }, 2000);

  /* ---------------- 部署 ---------------- */
  function rDeploy(s) {
    const d = s.deploy;
    const pend = isPending(s);
    const instCard = s.registered ? `
      <div class="inst-card ok">
        <span class="inst-ic"><svg class="ic"><use href="#i-shield"/></svg></span>
        <div class="inst-txt">
          <b>servy 托管中 <span class="badge run" style="height:19px"><i></i>已注册</span></b>
          <small>由 ServDeck 通过 servy 引擎注册为 Windows 服务；修改参数后需「重新安装」写回 SCM。</small>
        </div>
        <div class="inst-acts">
          <button class="btn btn-ghost btn-sm" data-action="reinstall" ${pend ? 'disabled' : ''}><svg class="ic"><use href="#i-restart"/></svg>重新安装</button>
          <button class="btn btn-danger-o btn-sm" data-action="uninstall" ${pend ? 'disabled' : ''}><svg class="ic"><use href="#i-trash"/></svg>卸载</button>
        </div>
        <div class="steps" id="instSteps"></div>
      </div>` : `
      <div class="inst-card info">
        <span class="inst-ic"><svg class="ic"><use href="#i-plug"/></svg></span>
        <div class="inst-txt">
          <b>纳管模式 · 尚未托管注册</b>
          <small>当前仅做状态监控。接入托管后将获得：开机自启、崩溃守护重启、日志轮转、一键重装（保留现有数据与配置）。</small>
        </div>
        <div class="inst-acts">
          <button class="btn btn-primary btn-sm" data-action="adopt" ${pend ? 'disabled' : ''}><svg class="ic"><use href="#i-shield"/></svg>接入托管</button>
        </div>
        <div class="steps" id="instSteps"></div>
      </div>`;

    let formHtml = '';
    if (d) {
      const f = (label, key, val, span, hint, ro) => `
        <div class="field ${span === 2 ? 'span2' : ''}">
          <label>${label}${hint ? ` <span class="hint">${hint}</span>` : ''}</label>
          <div class="input"><input class="mono" data-field="${key}" value="${escAttr(val)}" spellcheck="false" ${ro ? 'readonly style="color:var(--gn-fg-4)"' : ''} /></div>
        </div>`;
      const rows = [];
      if (s.type === 'java') {
        rows.push(f('Java 路径', 'javaPath', d.javaPath, 2));
        rows.push(f('JVM 参数', 'jvmArgs', d.jvmArgs, 1, '如 -Xms2g -Xmx2g'));
        rows.push(f('应用参数', 'appArgs', d.appArgs, 1, '如 -jar app.jar'));
      } else {
        rows.push(f('程序文件', 'program', d.program, 2));
        rows.push(f('启动参数', 'params', d.params || '', 2));
      }
      rows.push(f('显示名称', 'display', s.display, 1));
      rows.push(f('工作目录', 'workDir', d.workDir, 1));
      rows.push(f('服务描述', 'desc', s.desc || '', 2));
      rows.push(f('日志目录', 'logDir', d.logDir, 2, 'stdout.log / stderr.log'));
      rows.push(`
        <div class="field">
          <label>启动类型</label>
          <div class="input"><select data-field="startType">
            ${START_TYPES.map(([v, t]) => `<option value="${v}" ${d.startType === v ? 'selected' : ''}>${t}</option>`).join('')}
          </select></div>
        </div>
        <div class="field">
          <label>守护与轮转</label>
          <div class="switch-row" style="height:31px">
            <button class="switch ${d.guard ? 'on' : ''}" data-action="flip" data-field="guard" title="崩溃自动重启"></button>
            <span class="sw-label">崩溃重启<small>异常退出自动拉起</small></span>
            <button class="switch ${d.rotate ? 'on' : ''}" data-action="flip" data-field="rotate" title="日志大小轮转" style="margin-left:10px"></button>
            <span class="sw-label">轮转<small>--enableSizeRotation</small></span>
          </div>
        </div>`);
      formHtml = `
        <div class="panel">
          <div class="p-head"><h3>启动参数 <span class="sub">对应 servy-cli install 的安装参数</span></h3></div>
          <div class="fields">${rows.join('')}</div>
          ${commandPreview(s)}
        </div>`;
    }

    const portsHtml = `
      <div class="panel">
        <div class="p-head">
          <h3>依赖端口健康 <span class="sub">安装前预检 · 运行期巡检（netstat）</span></h3>
          <div class="h-act"><button class="chip" data-action="port-check"><svg class="ic"><use href="#i-restart"/></svg>重新检测</button></div>
        </div>
        <div id="portList">${s.depsPorts.map(p => `
          <div class="port-row" data-port="${p.port}">
            <i class="p-dot ${p.ok ? 'ok' : 'down'}"></i>
            <span class="p-port">:${p.port}</span>
            <span class="p-label">${p.label}</span>
            <span class="p-state ${p.ok ? 'ok' : 'down'}">${p.ok ? '监听中' : '未检测到服务'}</span>
          </div>`).join('')}
        </div>
      </div>`;

    const envHtml = s.env ? `
      <div class="panel">
        <div class="p-head"><h3>运行环境 <span class="sub">对应脚本 Version Info</span></h3></div>
        <div class="term">
          <div class="cmdline"><b>$</b> ${escHtml(s.env.cmdline)}</div>
          ${escHtml(s.env.out).split('\n').map(l => `<div>${l}</div>`).join('')}
        </div>
        <div class="env-row">
          <i class="engine-dot"></i>
          <span>servy 引擎</span>
          <span class="mono">servy-10.1.exe · v10.1.0</span>
          <span class="badge run" style="margin-left:auto"><i></i>就绪</span>
        </div>
      </div>` : '';

    return instCard + formHtml + portsHtml + envHtml;
  }

  function commandPreview(s) {
    const d = s.deploy;
    const params = s.type === 'java' ? `${d.jvmArgs} ${d.appArgs}`.trim() : (d.params || '');
    const program = s.type === 'java' ? d.javaPath : d.program;
    const lines = [
      ['servy-cli install', ''],
      ['--path', `"${program}"`],
      ['--params', `"${params}"`],
      ['--name', `"${s.name}"`],
      ['--displayName', `"${s.display}"`],
      s.desc ? ['--description', `"${s.desc}"`] : null,
      ['--startupDir', `"${d.workDir}"`],
      ['--startupType', d.startType],
      ['--stdout', `"${d.logDir}\\stdout.log"`],
      ['--stderr', `"${d.logDir}\\stderr.log"`],
      d.rotate ? ['--enableSizeRotation', ''] : null,
    ].filter(Boolean);
    return `
      <div class="cmd-block">
        <div class="cmd-bar">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="t">安装命令预览 · 随参数实时生成</span>
          <button class="copy" data-action="copy-cmd"><svg class="ic"><use href="#i-copy"/></svg>复制</button>
        </div>
        <div class="cmd-body" id="cmdBody">${lines.map(([k, v], i) =>
          `<div><span class="flag">${escHtml(k)}</span>${v ? '=' + escHtml(v) : ''}${i < lines.length - 1 ? ' <span class="cont">^</span>' : ''}</div>`).join('')}
        </div>
      </div>`;
  }
  const buildCommand = s => {
    const d = s.deploy;
    const params = s.type === 'java' ? `${d.jvmArgs} ${d.appArgs}`.trim() : (d.params || '');
    const program = s.type === 'java' ? d.javaPath : d.program;
    return [
      'servy-cli install',
      `--path="${program}"`, `--params="${params}"`, `--name="${s.name}"`, `--displayName="${s.display}"`,
      s.desc ? `--description="${s.desc}"` : null,
      `--startupDir="${d.workDir}"`, `--startupType=${d.startType}`,
      `--stdout="${d.logDir}\\stdout.log"`, `--stderr="${d.logDir}\\stderr.log"`,
      d.rotate ? '--enableSizeRotation' : null,
    ].filter(Boolean).join(' ');
  };

  /* 部署页交互（事件委托） */
  $('dwBody').addEventListener('input', e => {
    const el = e.target;
    if (!el.matches('[data-field]')) return;
    const s = SERVICES[current];
    const k = el.dataset.field, v = el.value;
    if (k === 'display') { s.display = v; }
    else if (k === 'desc') { s.desc = v; }
    else if (k === 'startType') { s.deploy.startType = v; s.startType = v; }
    else s.deploy[k] = v;
    if (k === 'startType') renderHead();
    const body = $('cmdBody');
    if (body) {
      const pane = document.createElement('div');
      pane.innerHTML = commandPreview(s);
      body.closest('.cmd-block').replaceWith(pane.firstElementChild);
    }
  });
  $('dwBody').addEventListener('click', e => {
    const el = e.target.closest('[data-action]'); if (!el) return;
    const s = SERVICES[current];
    const act = el.dataset.action;
    if (act === 'copy-cmd') copyText(buildCommand(s), '安装命令已复制');
    else if (act === 'flip') {
      const k = el.dataset.field;
      s.deploy[k] = !s.deploy[k];
      el.classList.toggle('on', s.deploy[k]);
      const body = $('cmdBody');
      if (body) {
        const pane = document.createElement('div');
        pane.innerHTML = commandPreview(s);
        body.closest('.cmd-block').replaceWith(pane.firstElementChild);
      }
    }
    else if (act === 'port-check') checkPorts(s);
    else if (act === 'reinstall') runInstall(s, true);
    else if (act === 'adopt') runInstall(s, false);
    else if (act === 'uninstall') askUninstall(s);
  });

  function checkPorts(s) {
    const rows = document.querySelectorAll('#portList .port-row');
    rows.forEach(r => {
      r.querySelector('.p-dot').className = 'p-dot chk';
      const st = r.querySelector('.p-state');
      st.className = 'p-state'; st.textContent = '检测中…';
    });
    setTimeout(() => {
      s.depsPorts.forEach((p, i) => {
        if (!p.ok && Math.random() < 0.6) p.ok = true;   // 演示：部分端口恢复
        const r = rows[i]; if (!r) return;
        r.querySelector('.p-dot').className = 'p-dot ' + (p.ok ? 'ok' : 'down');
        const st = r.querySelector('.p-state');
        st.className = 'p-state ' + (p.ok ? 'ok' : 'down');
        st.textContent = p.ok ? '监听中' : '未检测到服务';
      });
      toast('端口检测完成');
    }, 900);
  }

  /* 安装流程：预检依赖端口 → 停止并清理旧服务 → 注册并启动（对应脚本 :INSTALL 三步） */
  function runInstall(s, isReinstall) {
    if (isPending(s)) return;
    s._pending = 'installing';
    renderHead();
    const box = $('instSteps');
    if (box) {
      box.classList.add('show');
      box.innerHTML = [
        ['st1', '1', '预检依赖端口', ''],
        ['st2', '2', isReinstall ? '停止并清理旧服务' : '停止同名旧服务（如存在）', ''],
        ['st3', '3', '注册并启动', ''],
      ].map(([id, n, label]) => `<div class="step" id="${id}"><span class="s-ic">${n}</span>${label}<span class="s-sub"></span></div>`).join('');
    }
    const setStep = (id, cls, sub) => {
      const st = $(id); if (!st) return;
      st.className = 'step ' + cls;
      if (sub !== undefined) st.querySelector('.s-sub').textContent = sub;
      if (cls === 'doing') st.querySelector('.s-ic').innerHTML = '<svg class="ic spin"><use href="#i-restart"/></svg>';
      if (cls === 'done') st.querySelector('.s-ic').innerHTML = '<svg class="ic"><use href="#i-check"/></svg>';
      if (cls === 'warn') st.querySelector('.s-ic').innerHTML = '<svg class="ic"><use href="#i-warn"/></svg>';
    };
    const finish = (stateRunning, evt) => {
      s._pending = null;
      if (stateRunning) { s.state = 'Running'; s.pid = s.pid || 1000 + Math.floor(Math.random() * 9000); if (!s.uptime) s.uptime = '刚刚启动'; }
      s.registered = true;
      s.events.unshift({ t: nowLabel(), d: evt.d, html: evt.html });
      renderHead(); renderTree(); renderPhList(); renderBody();
      toast(isReinstall ? '重新安装完成，服务已启动' : '托管接入完成，服务已启动');
      setTimeout(() => { const b = $('instSteps'); if (b) { b.classList.remove('show'); b.innerHTML = ''; } }, 1400);
    };
    setStep('st1', 'doing');
    setTimeout(() => {
      const down = s.depsPorts.filter(p => !p.ok).length;
      setStep('st1', down ? 'warn' : 'done', down ? `${s.depsPorts.length - down}/${s.depsPorts.length} 端口监听` : '全部监听');
      setStep('st2', 'doing');
      setTimeout(() => {
        setStep('st2', 'done', '已清理');
        setStep('st3', 'doing');
        setTimeout(() => {
          setStep('st3', 'done', 'SCM 注册成功');
          setTimeout(() => finish(true, {
            d: 'run',
            html: `<b>${s.display}</b> ${isReinstall ? '重新安装并启动成功' : '托管接入成功，已注册并启动'}<span class="tag ok">${isReinstall ? '重装' : '接入托管'}</span>`,
          }), 400);
        }, 900);
      }, 900);
    }, 1000);
  }

  /* 卸载（对应脚本 :UNINSTALL 的 Y/N 确认） */
  let confirmCb = null;
  function askUninstall(s) {
    $('mdTitle').textContent = '卸载服务';
    $('mdText').innerHTML =
      `将先停止并从 Windows 服务控制器移除 <code>${escHtml(s.name)}</code>（servy 托管）。` +
      `程序文件与日志目录会保留，注册信息可在「接入托管」中恢复。确认卸载？`;
    $('mdOk').textContent = '确认卸载';
    confirmCb = () => {
      hideConfirm();
      if (isPending(s)) return;
      const wasRunning = isRunning(s);
      s._pending = 'uninstalling';
      renderHead();
      setTimeout(() => {
        s._pending = null;
        s.state = 'Stopped'; s.pid = null; s.registered = false; s.uptime = null;
        s.events.unshift({ t: nowLabel(), d: 'warn', html: `<b>${s.display}</b> 服务已卸载（servy 托管移除，文件保留）<span class="tag warn">卸载</span>` });
        renderHead(); renderTree(); renderPhList(); renderBody();
        toast('服务已卸载');
      }, wasRunning ? 1400 : 800);
    };
    $('modalMask').classList.add('show');
  }
  function hideConfirm() { $('modalMask').classList.remove('show'); confirmCb = null; }
  $('mdCancel').addEventListener('click', hideConfirm);
  $('modalMask').addEventListener('click', e => { if (e.target === $('modalMask')) hideConfirm(); });
  $('mdOk').addEventListener('click', () => { if (confirmCb) confirmCb(); });

  /* ---------------- 配置文件 ---------------- */
  function updateConfBadge() {
    const s = SERVICES[current];
    $('confDirtyBadge').style.display = confDirty && s.hasConf ? 'inline-flex' : 'none';
  }
  function rConf(s) {
    if (!s.hasConf || !s.conf) {
      return `<div class="empty">
        <svg class="ic"><use href="#i-conf"/></svg>
        <b>该服务未挂接配置文件托管</b>
        <p>可在「添加服务 → 高级」中为服务关联配置文件（如 application.yml）。<br/>关联后支持字段化编辑、自动备份与「重启生效」提醒。</p>
      </div>`;
    }
    const c = s.conf;
    const fieldsHtml = c.fields.map(([k, label, val, type]) => `
      <div class="field"><label>${label}</label>
        <div class="input"><input class="mono" data-cf="${k}" ${type === 'password' ? 'type="password"' : ''} value="${escAttr(val)}" spellcheck="false" /></div>
      </div>`).join('');
    return `
      <div class="panel">
        <div class="conf-head">
          <span class="cf-name">${c.file}</span>
          <span class="cf-path">${c.path}</span>
          <span class="seg cf-mode" id="confModeSeg">
            <button class="${confMode === 'fields' ? 'on' : ''}" data-cm="fields">按字段编辑</button>
            <button class="${confMode === 'raw' ? 'on' : ''}" data-cm="raw">原文编辑</button>
          </span>
        </div>
        <div class="conf-body">
          <div class="fields" id="confFields" style="display:${confMode === 'fields' ? 'grid' : 'none'};margin-top:10px">${fieldsHtml}</div>
          <textarea class="mono" id="confRaw" style="display:${confMode === 'raw' ? 'block' : 'none'}" spellcheck="false">${escHtml(renderConfRaw(s))}</textarea>
          <div class="conf-foot">
            <span class="hint">修改后点击保存写回 <b>${c.file}</b>；保存前自动备份，可随时回滚。修改在服务<b>重启后生效</b>。</span>
            <button class="btn btn-ghost btn-sm" data-action="conf-discard" style="display:${confDirty ? 'inline-flex' : 'none'}">放弃更改</button>
            <button class="btn btn-primary btn-sm" data-action="conf-save">保存配置</button>
          </div>
        </div>
      </div>
      <div class="restart-bar ${confDirty ? 'show' : ''}" id="restartBar">
        <span class="rb-ic"><svg class="ic"><use href="#i-restart"/></svg></span>
        <span class="rb-text">配置已保存，需重启服务生效<small>${c.file} 已写回（原文件已自动备份）；重启约需 3~5 秒，期间服务短暂不可用。</small></span>
        <span class="rb-actions">
          <button class="btn btn-ghost btn-sm" data-action="conf-later">稍后重启</button>
          <button class="btn btn-primary btn-sm" data-action="conf-restart"><svg class="ic"><use href="#i-restart"/></svg>立即重启</button>
        </span>
      </div>`;
  }
  function renderConfRaw(s) {
    const g = k => { const el = document.querySelector(`#confFields input[data-cf="${k}"]`); return el ? el.value : ''; };
    if (g('apiPort') === '') {
      return s.conf.fields.map(([k, , v]) => `${k.toUpperCase()}=${v}`).join('\n');
    }
    return `RUSTFS_ACCESS_KEY=${g('accessKey')}\nRUSTFS_SECRET_KEY=${g('secretKey')}\nRUSTFS_VOLUMES=${g('dataDir')}\nRUSTFS_ADDRESS=0.0.0.0:${g('apiPort')}\nRUSTFS_CONSOLE_ADDRESS=0.0.0.0:${g('consolePort')}\nRUSTFS_CONSOLE_ENABLE=true\nRUST_LOG=${g('logLevel')}`;
  }
  function parseRawToFields(s, raw) {
    const map = {};
    raw.split('\n').forEach(line => {
      const m = line.match(/^([A-Z_]+)=(.*)$/);
      if (m) map[m[1]] = m[2].trim();
    });
    const set = (k, v) => { if (v === undefined) return; const f = s.conf.fields.find(x => x[0] === k); if (f) f[2] = v; };
    set('accessKey', map.RUSTFS_ACCESS_KEY); set('secretKey', map.RUSTFS_SECRET_KEY);
    set('dataDir', map.RUSTFS_VOLUMES);
    if (map.RUSTFS_ADDRESS) set('apiPort', map.RUSTFS_ADDRESS.split(':').pop());
    if (map.RUSTFS_CONSOLE_ADDRESS) set('consolePort', map.RUSTFS_CONSOLE_ADDRESS.split(':').pop());
    set('logLevel', map.RUST_LOG);
  }
  $('dwBody').addEventListener('click', e => {
    const cm = e.target.closest('[data-cm]');
    if (cm) {
      const s = SERVICES[current];
      if (cm.dataset.cm === 'raw' && confMode === 'fields') $('confRaw').value = renderConfRaw(s);
      confMode = cm.dataset.cm;
      document.querySelectorAll('#confModeSeg button').forEach(x => x.classList.toggle('on', x === cm));
      $('confFields').style.display = confMode === 'fields' ? 'grid' : 'none';
      $('confRaw').style.display = confMode === 'raw' ? 'block' : 'none';
    }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const s = SERVICES[current];
    const act = el.dataset.action;
    if (act === 'conf-save') {
      if (confMode === 'raw' && s.hasConf) parseRawToFields(s, $('confRaw').value);
      confDirty = true; updateConfBadge(); renderBody(); toast('配置已保存（待重启生效）');
    }
    else if (act === 'conf-discard' || act === 'conf-later') { confDirty = false; updateConfBadge(); renderBody(); }
    else if (act === 'conf-restart') {
      if (isPending(s)) return;
      setState(s, 'restarting', 'Running', { d: 'run', html: `<b>${s.display}</b> 配置变更后重启完成<span class="tag ok">重启</span>`, delay: 1600 }, () => {
        confDirty = false; updateConfBadge(); renderBody();
      });
    }
  });
  $('dwBody').addEventListener('input', e => {
    if (!e.target.matches('[data-cf], #confRaw')) return;
    const s = SERVICES[current];
    if (e.target.matches('[data-cf]') && s.hasConf) {
      const f = s.conf.fields.find(x => x[0] === e.target.dataset.cf);
      if (f) f[2] = e.target.value;
    }
    confDirty = true; updateConfBadge();
    const foot = document.querySelector('#dwBody [data-action="conf-discard"]');
    if (foot) foot.style.display = 'inline-flex';
    const bar = $('restartBar'); if (bar) bar.classList.add('show');
  });

  /* ---------------- 日志 ---------------- */
  function rLogs(s) {
    const files = s.logFiles;
    if (logSel >= files.length) logSel = 0;
    const f = files[logSel];
    const lines = f.kind === 'err' ? s.logs.err : s.logs.out;
    const view = lines.map(([t, lv, msg]) => {
      const cls = lv === 'ERROR' ? 'lg-error' : lv === 'WARN' ? 'lg-warn' : 'lg-info';
      return `<div class="${cls}"><span class="lg-t">${t}</span><span class="lg-lv">${lv}</span>${escHtml(msg)}</div>`;
    }).join('');
    return `
      <div class="panel" style="padding:10px 12px">
        <div class="log-files">
          ${files.map((fl, i) => `
            <button class="log-file ${i === logSel ? 'on' : ''}" data-logf="${i}">
              <span class="f-name">${fl.name}${fl.kind === 'err' ? ' <span class="errdot" style="color:var(--gn-danger)">●</span>' : ''}</span>
              <span class="f-meta">${fl.size} · ${fl.mtime}${fl.kind === 'rot' ? ' · <span class="f-rot">轮转</span>' : ''}</span>
            </button>`).join('')}
        </div>
      </div>
      <div class="panel" style="padding:9px 12px">
        <div class="log-toolbar">
          <span class="mono" style="font-size:11px;color:var(--gn-fg-5)">${f.name} · ${f.size}</span>
          <span style="flex:1"></span>
          <button class="chip on" data-action="log-scroll"><svg class="ic"><use href="#i-chev"/></svg>自动滚动</button>
          <button class="chip" data-action="log-open"><svg class="ic"><use href="#i-folder"/></svg>打开目录</button>
          <button class="chip" data-action="log-download"><svg class="ic"><use href="#i-download"/></svg>下载</button>
        </div>
      </div>
      <div class="log-view" id="logView">${view}</div>`;
  }
  $('dwBody').addEventListener('click', e => {
    const lf = e.target.closest('[data-logf]');
    if (lf) { logSel = +lf.dataset.logf; renderBody(); scrollLogBottom(); return; }
    const el = e.target.closest('[data-action]'); if (!el) return;
    const act = el.dataset.action;
    if (act === 'log-scroll') el.classList.toggle('on');
    else if (act === 'log-open') toast('原型演示：将在资源管理器打开日志目录');
    else if (act === 'log-download') toast('原型演示：已导出日志压缩包');
  });
  function scrollLogBottom() {
    requestAnimationFrame(() => { const v = $('logView'); if (v) v.scrollTop = v.scrollHeight; });
  }

  /* ---------------- 事件 ---------------- */
  function rEvents(s) {
    return `<div class="panel">${s.events.map(ev => `
      <div class="event">
        <i class="e-dot ${ev.d}"></i><span class="e-time">${ev.t}</span>
        <div class="e-body">${ev.html}</div>
      </div>`).join('')}</div>`;
  }

  /* ---------------- 工具 ---------------- */
  function escHtml(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escAttr(x) { return escHtml(x).replace(/"/g, '&quot;'); }

  /* ================================================================ 初始化 */
  renderTree();
  renderPhList();
  // 默认打开主角服务，直接展示面板内容
  openDrawer('WEC-AI-PLATFORM');
</script>
</body>
</html>

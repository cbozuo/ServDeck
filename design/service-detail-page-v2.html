            <b>纳管模式 · 尚未托管注册</b>
            <small>当前仅做状态监控。点击顶部「注册」接入 servy 托管后，可获得开机自启、崩溃守护重启、日志轮转与一键重装（保留现有数据与配置）。</small>
          </div>
        </div>
        <div class="steps" id="instSteps"></div>
      </div>`;

    /* ——— ① 纳管信息（只读）———
       这批字段就是「添加服务」弹窗里录入的内容，纳管后作为服务身份不可变更；
       与运行参数分开陈列，避免用户以为它们可以就地编辑。 */
    const identityHtml = `
      <div class="panel">
        <div class="p-head">
          <h3>纳管信息 <span class="sub">添加服务时录入 · 纳管后不可修改</span></h3>
          <div class="h-act"><span class="chip" style="cursor:default;color:var(--gn-fg-5)" title="如需变更服务名 / 显示名称 / 程序文件，请移除该服务后重新添加"><svg class="ic"><use href="#i-shield"/></svg>只读</span></div>
        </div>
        <div class="kv-list">
          <div class="kv-row"><span class="k">服务名</span><span class="v" title="${escAttr(s.name)}">${escHtml(s.name)}</span></div>
          <div class="kv-row"><span class="k">显示名称</span><span class="v sans">${escHtml(s.display)}</span></div>
          <div class="kv-row"><span class="k">程序文件</span><span class="v" title="${escAttr(s.programFile || '')}">${escHtml(s.programFile || '—')}</span><button class="in-act" data-act="open-workdir" title="打开所在目录（即工作目录）"><svg class="ic"><use href="#i-folder"/></svg></button></div>
          <div class="kv-row"><span class="k">服务描述</span><span class="v sans" title="${escAttr(s.desc || '')}">${escHtml(s.desc || '—')}</span></div>
          <div class="kv-row"><span class="k">${s.registered ? '注册时间' : '纳管时间'}</span><span class="v sans">${s.addedAt}</span></div>
        </div>
      </div>`;

    /* ——— ② 运行参数（可编辑，改动需「重新注册」写回 SCM）——— */
    let formHtml = '';
    if (d) {
      const f = (label, key, val, span, hint, act) => `
        <div class="field ${span === 2 ? 'span2' : ''}">
          <label>${label}${hint ? ` <span class="hint">${hint}</span>` : ''}</label>
          <div class="input ${editable ? '' : 'locked'}">
            <input class="mono" data-field="${key}" value="${escAttr(val)}" spellcheck="false" ${editable ? '' : 'readonly'} />
            ${act ? `<button class="in-act" data-act="${act.a}" title="${editable ? act.t : '服务运行中，参数已锁定'}" ${editable ? '' : 'disabled'}><svg class="ic"><use href="#${act.icon || 'i-folder'}"/></svg></button>` : ''}
          </div>
        </div>`;
      const rows = [];
      if (s.type === 'java') {
        rows.push(f('JVM 路径', 'javaPath', d.javaPath, 2, 'java.exe 完整路径', { a: 'pick-jdk', t: '选择本机 JDK', icon: 'i-java' }));
        rows.push(f('JVM 参数', 'jvmArgs', d.jvmArgs, 2, '脚本默认 -Xms2g -Xmx2g'));
        /* JVM 常用参数快捷设置：堆内存拖拽滑杆 + 数值输入框（写 -Xms/-Xmx）+ 开关多选（布尔类）。
           未停止（运行中 / 转场中）一律禁用——参数只在进程启动时读取，且改动需重新注册。 */
        const jvmArgsText = String(d.jvmArgs || '');
        const heapCurGB = heapParse(jvmArgsText);
        const heapExact = HEAP_STOPS.includes(heapCurGB);
        const heapIdx = heapExact ? HEAP_STOPS.indexOf(heapCurGB)
          : isNaN(heapCurGB) ? Math.max(0, HEAP_STOPS.indexOf(2))
          : HEAP_STOPS.reduce((b, g, i) => (Math.abs(g - heapCurGB) < Math.abs(HEAP_STOPS[b] - heapCurGB) ? i : b), 0);
        const heapFill = (heapIdx / (HEAP_STOPS.length - 1) * 100).toFixed(1);
        const heapDisp = isNaN(heapCurGB) ? '2G' : (heapExact ? heapLabel(heapCurGB) : heapNum(heapCurGB));
        rows.push(`
        <div class="field span2 jvm-presets">
          <label>常用参数 <span class="hint">堆内存拖动或键入自动写入 -Xms/-Xmx、开关点击追加 / 移除；带值参数直接在上方输入框编辑</span></label>
          <div class="preset-row">
            <span class="preset-label">堆内存</span>
            <input type="range" class="heap-range" data-act="heap-range" min="0" max="${HEAP_STOPS.length - 1}" step="1" value="${heapIdx}" ${editable ? '' : 'disabled'} style="--fill:${heapFill}%" aria-label="堆内存档位" />
            <div class="input heap-input">
              <input class="mono" data-heap-input value="${escAttr(heapDisp)}" spellcheck="false" ${editable ? '' : 'readonly'} title="${editable ? '可直接键入，如 2G / 1536M，回车确认' : '服务运行中，参数已锁定'}" aria-label="堆内存" />
            </div>
            <span class="heap-cap" title="自动检测本机物理内存 ${HOST_MEM_GB}G，堆上限 = 75% = ${heapLabel(HEAP_MAX_GB)}">${heapLabel(HEAP_STOPS[0])} – ${heapLabel(HEAP_STOPS[HEAP_STOPS.length - 1])} · 本机上限</span>
          </div>
          <div class="preset-row">
            <span class="preset-label">开关</span>
            <div class="preset-chips">
              ${[
              { label: 'OOM 转储', flag: '-XX:+HeapDumpOnOutOfMemoryError', hint: '内存溢出时自动生成堆转储文件，排障必备' },
              { label: 'G1 收集器', flag: '-XX:+UseG1GC', hint: '大堆服务的均衡型 GC 策略' },
              { label: 'ZGC', flag: '-XX:+UseZGC', hint: '低停顿收集器，适合大内存低延迟场景' },
              { label: 'UTF-8 编码', flag: '-Dfile.encoding=UTF-8', hint: '强制文件编码，避免中文乱码' },
              { label: '上海时区', flag: '-Duser.timezone=Asia/Shanghai', hint: '固定时区，避免系统时区差异导致时间错乱' },
              { label: '远程调试 :5005', flag: '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005', hint: '开放 JVM 远程调试端口，排障时使用' },
            ].map(p => {
              const on = jvmArgsText.includes(p.flag);
              return `<button type="button" class="preset-chip${on ? ' on' : ''}" data-act="jvm-flag" data-jvm-flag="${escAttr(p.flag)}" ${editable ? '' : 'disabled'} title="${escAttr((on ? '点击移除：' : '点击追加：') + p.flag)} · ${escAttr(p.hint)}">${escHtml(p.label)}</button>`;
            }).join('')}
          </div>
        </div>
      </div>`);
      } else {
        rows.push(f('启动参数', 'params', d.params || '', 2, '拼接在程序文件之后的参数'));
      }
      rows.push(`
        <div class="field">
          <label>启动类型</label>
          <div class="seg-group" role="radiogroup" aria-label="启动类型">
            ${START_TYPES.map(([v]) => `<button type="button" class="seg-btn${d.startType === v ? ' on' : ''}" data-act="start-type" data-value="${v}" ${editable ? '' : 'disabled'} title="${escAttr(startTypeText(v))}">${escHtml(START_SHORT[v] || v)}</button>`).join('')}
          </div>
        </div>
        <div class="field span2">
          <label>守护与轮转</label>
          <div class="switch-row" style="height:31px">
            <button class="switch ${d.guard ? 'on' : ''}" data-act="flip" data-field="guard" title="崩溃自动重启" ${editable ? '' : 'disabled'}></button>
            <span class="sw-label">崩溃重启<small>异常退出自动拉起</small></span>
            <button class="switch ${d.rotate ? 'on' : ''}" data-act="flip" data-field="rotate" title="日志大小轮转" style="margin-left:10px" ${editable ? '' : 'disabled'}></button>
            <span class="sw-label">轮转<small>--enableSizeRotation</small></span>
          </div>
        </div>`);
      formHtml = `
        <div class="panel">
          <div class="p-head"><h3>运行参数 <span class="sub">对应 servy-cli install · 改动需「重新注册」写回 SCM</span>${editable ? '' : ' <span class="sub">· 已锁定</span>'}</h3></div>
          ${lock ? `
            <div class="lock-bar">
              <span class="lb-ic"><svg class="ic"><use href="#i-warn"/></svg></span>
              <div class="lb-text">${lock[0]}<small>${lock[1]}</small></div>
              ${busy ? '' : '<button class="btn btn-ghost btn-sm" data-act="stop"><svg class="ic"><use href="#i-stop"/></svg>停止服务</button>'}
            </div>` : ''}
          <div class="fields">${rows.join('')}</div>
          ${commandPreview(s)}
        </div>`;
    } else {
      formHtml = `
        <div class="panel">
          <div class="p-head"><h3>运行参数</h3></div>
          <div class="empty" style="box-shadow:none;background:transparent;padding:18px">
            <svg class="ic"><use href="#i-plug"/></svg>
            <b>暂无托管运行参数</b>
            <p>该服务由系统安装器注册，ServDeck 未接管其启动参数。<br/>执行顶部「注册」接入 servy 托管后，即可在此配置参数、工作目录与日志轮转。</p>
          </div>
        </div>`;
    }



    return instCard + identityHtml + formHtml + (s.conf ? confPanel(s) : '');
  }

  /* 工作目录 / 应用参数由「程序文件」派生，不再是独立字段：
     工作目录 = 程序文件所在目录；Java 应用参数 = -jar 程序文件名（与脚本自动取最新 JAR 的行为一致） */
  const dirOf = p => p.replace(/\\[^\\]+$/, '');
  const baseOf = p => p.split('\\').pop();
  /* ServDeck 数据根目录（存储设置页可改，含迁移）。托管日志不再 per-service 配置：
     统一派生为 数据根目录\logs\<服务名>，随数据目录迁移一起走，与「驱动目录 = 数据目录\drivers」同一模式。 */
  const DATA_ROOT = 'C:\\Users\\Administrator\\.servdeck';
  const svcLogDir = s => DATA_ROOT + '\\logs\\' + s.name;
  const svcProgram = s => (s.type === 'java' ? s.deploy.javaPath : s.programFile);
  const svcParams = s => (s.type === 'java'
    ? (s.deploy.jvmArgs + ' -jar ' + baseOf(s.programFile)).trim()
    : (s.deploy.params || ''));
  const runCommand = s => {
    if (!s.deploy) return 'sc query ' + s.name;
    return ('"' + svcProgram(s) + '" ' + svcParams(s)).trim();
  };

  /* 安装命令实时预览 */
  function commandPreview(s) {
    const d = s.deploy;
    const params = svcParams(s);
    const program = svcProgram(s);
    const lines = [
      ['servy-cli install', ''],
      ['--path', `"${program}"`],
      ['--params', `"${params}"`],
      ['--name', `"${s.name}"`],
      ['--displayName', `"${s.display}"`],
      s.desc ? ['--description', `"${s.desc}"`] : null,
      ['--startupDir', `"${dirOf(s.programFile)}"`],
      ['--startupType', d.startType],
      ['--stdout', `"${svcLogDir(s)}\\stdout.log"`],
      ['--stderr', `"${svcLogDir(s)}\\stderr.log"`],
      d.rotate ? ['--enableSizeRotation', ''] : null,
    ].filter(Boolean);
    return `
      <div class="cmd-block">
        <div class="cmd-bar">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="t">安装命令预览 · 随参数实时生成</span>
          <button class="copy" data-act="copy-cmd"><svg class="ic"><use href="#i-copy"/></svg>复制</button>
        </div>
        <div class="cmd-body" id="cmdBody">${lines.map(([k, v], i) =>
          `<div><span class="flag">${escHtml(k)}</span>${v ? '=' + escHtml(v) : ''}${i < lines.length - 1 ? ' <span class="cont">^</span>' : ''}</div>`).join('')}
        </div>
      </div>`;
  }
  /* 参数变动后就地刷新安装命令预览（不重建整个面板，避免输入失焦） */
  function refreshCmdPreview(s) {
    const body = $('cmdBody');
    if (!body) return;
    const pane = document.createElement('div');
    pane.innerHTML = commandPreview(s);
    body.closest('.cmd-block').replaceWith(pane.firstElementChild);
  }
  /* 堆内存提交（滑杆松手 / 输入框回车·失焦共用）：-Xms/-Xmx 同值并保持在参数最前
     （与脚本默认顺序一致），同步回 JVM 参数输入框与安装命令预览 */
  function heapApply(s, gb) {
    const num = heapNum(gb);
    const rest = String(s.deploy.jvmArgs || '').split(/\s+/).filter(a => a && !/^-Xms/i.test(a) && !/^-Xmx/i.test(a));
    s.deploy.jvmArgs = ['-Xms' + num, '-Xmx' + num, ...rest].join(' ');
    const inp = $('viewDetail').querySelector('input[data-field="jvmArgs"]');
    if (inp) inp.value = s.deploy.jvmArgs;
    refreshCmdPreview(s);
    renderPane();
  }
  /* 堆内存手动输入提交：数字 + 可选单位（m / g）；非法回退，超限收敛到本机堆上限 */
  function heapCommitInput(s, raw) {
    const m = String(raw).trim().match(/^(\d+(?:\.\d+)?)\s*([mMgG]?)$/);
    if (!m) { toast('堆内存格式：数字 + 单位，如 2G / 1536M'); renderPane(); return; }
    let gb = parseFloat(m[1]) * (m[2].toLowerCase() === 'm' ? 1 / 1024 : 1);
    const cap = HEAP_STOPS[HEAP_STOPS.length - 1], min = HEAP_STOPS[0];
    if (gb > cap) { gb = cap; toast('已限制为本机堆上限 ' + heapLabel(cap)); }
    else if (gb < min) { gb = min; toast('堆内存下限 ' + heapLabel(min)); }
    heapApply(s, gb);
  }
  const buildCommand = s => {
    const d = s.deploy;
    const params = svcParams(s);
    const program = svcProgram(s);
    return [
      'servy-cli install',
      `--path="${program}"`, `--params="${params}"`, `--name="${s.name}"`, `--displayName="${s.display}"`,
      s.desc ? `--description="${s.desc}"` : null,
      `--startupDir="${dirOf(s.programFile)}"`, `--startupType=${d.startType}`,
      `--stdout="${svcLogDir(s)}\\stdout.log"`, `--stderr="${svcLogDir(s)}\\stderr.log"`,
      d.rotate ? '--enableSizeRotation' : null,
    ].filter(Boolean).join(' ');
  };

  /* 配置文件托管（字段 / 原文双向编辑） */
  function confPanel(s) {
    const c = s.conf;
    const fieldsHtml = c.fields.map(([k, label, val, type]) => `
      <div class="field"><label>${label}</label>
        <div class="input"><input class="mono" data-cf="${k}" ${type === 'password' ? 'type="password"' : ''} value="${escAttr(val)}" spellcheck="false" /></div>
      </div>`).join('');
    return `
      <div class="panel">
        <div class="conf-head">
          <span class="cf-name">${c.file}</span>
          <span class="cf-path">${c.path}</span>
          <span class="seg cf-mode" id="confModeSeg">
            <button class="${confMode === 'fields' ? 'on' : ''}" data-cm="fields">按字段编辑</button>
            <button class="${confMode === 'raw' ? 'on' : ''}" data-cm="raw">原文编辑</button>
          </span>
        </div>
        <div class="conf-body">
          <div class="fields" id="confFields" style="display:${confMode === 'fields' ? 'grid' : 'none'};margin-top:10px">${fieldsHtml}</div>
          <textarea class="mono" id="confRaw" style="display:${confMode === 'raw' ? 'block' : 'none'}" spellcheck="false">${escHtml(renderConfRaw(s))}</textarea>
          <div class="conf-foot">
            <span class="hint">修改后点击保存写回 <b>${c.file}</b>；保存前自动备份，可随时回滚。修改在服务<b>重启后生效</b>。</span>
            <button class="btn btn-ghost btn-sm" data-act="conf-discard" style="display:${confDirty ? 'inline-flex' : 'none'}">放弃更改</button>
            <button class="btn btn-primary btn-sm" data-act="conf-save">保存配置</button>
          </div>
        </div>
      </div>
      <div class="restart-bar ${confDirty ? 'show' : ''}" id="restartBar">
        <span class="rb-ic"><svg class="ic"><use href="#i-restart"/></svg></span>
        <span class="rb-text">配置已保存，需重启服务生效<small>${c.file} 已写回（原文件已自动备份）；重启约需 3~5 秒，期间服务短暂不可用。</small></span>
        <span class="rb-actions">
          <button class="btn btn-ghost btn-sm" data-act="conf-later">稍后重启</button>
          <button class="btn btn-primary btn-sm" data-act="conf-restart"><svg class="ic"><use href="#i-restart"/></svg>立即重启</button>
        </span>
      </div>`;
  }
  function renderConfRaw(s) {
    const g = k => { const el = document.querySelector(`#confFields input[data-cf="${k}"]`); return el ? el.value : ''; };
    if (s.conf.file !== 'rustfs.conf') {
      return s.conf.fields.map(([k, , v]) => `${k}=${v}`).join('\n');
    }
    return `RUSTFS_ACCESS_KEY=${g('accessKey')}\nRUSTFS_SECRET_KEY=${g('secretKey')}\nRUSTFS_VOLUMES=${g('dataDir')}\nRUSTFS_ADDRESS=0.0.0.0:${g('apiPort')}\nRUSTFS_CONSOLE_ADDRESS=0.0.0.0:${g('consolePort')}\nRUSTFS_CONSOLE_ENABLE=true\nRUST_LOG=${g('logLevel')}`;
  }
  function parseRawToFields(s, raw) {
    const map = {};
    raw.split('\n').forEach(line => {
      const m = line.match(/^([A-Z_]+)=(.*)$/);
      if (m) map[m[1]] = m[2].trim();
    });
    const set = (k, v) => { if (v === undefined) return; const f = s.conf.fields.find(x => x[0] === k); if (f) f[2] = v; };
    set('accessKey', map.RUSTFS_ACCESS_KEY); set('secretKey', map.RUSTFS_SECRET_KEY);
    set('dataDir', map.RUSTFS_VOLUMES);
    if (map.RUSTFS_ADDRESS) set('apiPort', map.RUSTFS_ADDRESS.split(':').pop());
    if (map.RUSTFS_CONSOLE_ADDRESS) set('consolePort', map.RUSTFS_CONSOLE_ADDRESS.split(':').pop());
    set('logLevel', map.RUST_LOG);
  }


  /* ---------------- 日志 ---------------- */
  function paneLogs(s) {
    const files = s.logFiles;
    if (logSel >= files.length) logSel = 0;
    const f = files[logSel];
    const lines = f.kind === 'err' ? s.logs.err : s.logs.out;
    const view = lines.map(([t, lv, msg]) => {
      const cls = lv === 'ERROR' ? 'lg-error' : lv === 'WARN' ? 'lg-warn' : 'lg-info';
      return `<div class="${cls}"><span class="lg-t">${t}</span><span class="lg-lv">${lv}</span>${escHtml(msg)}</div>`;
    }).join('');
    return `
      <div class="panel" style="padding:10px 12px">
        <div class="log-files">
          ${files.map((fl, i) => `
            <button class="log-file ${i === logSel ? 'on' : ''}" data-logf="${i}">
              <span class="f-name">${fl.name}${fl.kind === 'err' ? ' <span style="color:var(--gn-danger)">●</span>' : ''}</span>
              <span class="f-meta">${fl.size} · ${fl.mtime}${fl.kind === 'rot' ? ' · <span class="f-rot">轮转</span>' : ''}</span>
            </button>`).join('')}
        </div>
      </div>
      <div class="panel" style="padding:9px 12px">
        <div class="log-toolbar">
          <span class="mono" style="font-size:11px;color:var(--gn-fg-5)">${f.name} · ${f.size}</span>
          <span style="flex:1"></span>
          <button class="chip on" data-act="log-scroll"><svg class="ic"><use href="#i-chev"/></svg>自动滚动</button>
          <button class="chip" data-act="open-logdir"><svg class="ic"><use href="#i-folder"/></svg>打开目录</button>
          <button class="chip" data-act="log-download"><svg class="ic"><use href="#i-download"/></svg>下载</button>
        </div>
      </div>
      <div class="log-view" id="logView">${view}</div>`;
  }
  function scrollLogBottom() {
    const v = $('logView'); if (v) v.scrollTop = v.scrollHeight;
  }

  /* ---------------- 事件 ---------------- */
  function paneEvents(s) {
    return `<div class="panel">
      <div class="p-head"><h3>服务事件 <span class="sub">启停 / 守护重启 / 配置变更 / 依赖告警 / 注册卸载</span></h3></div>
      ${s.events.map(ev => `
        <div class="event">
          <i class="e-dot ${ev.d}"></i><span class="e-time">${ev.t}</span>
          <div class="e-body">${ev.html}</div>
        </div>`).join('')}
    </div>`;
  }

  /* ================================================================ 启停/重启（模拟 ControlWindowsService） */
  function refreshTabs() {
    const host = $('viewDetail') && $('viewDetail').querySelector('.dtabs');
    if (host) host.outerHTML = detailTabs(SERVICES[current]);
  }
  function setState(svc, pending, finalState, eventHtml, after) {
    svc._pending = pending;
    renderHero(); renderTree(); renderPhList();
    if (view === 'detail' && current === svc.name && ['overview', 'deploy', 'events'].includes(activeTab)) renderPane();
    setTimeout(() => {
      svc._pending = null;
      if (finalState) svc.state = finalState;
      if (finalState === 'Running') {
        svc.pid = svc.pid || 1000 + Math.floor(Math.random() * 9000);
        svc.uptime = svc.uptime || '刚刚启动';
        svc.startedAt = nowLabel().replace('今天 ', '');
      }
      if (finalState === 'Stopped') { svc.pid = null; svc.uptime = null; svc.startedAt = null; }
      if (eventHtml) svc.events.unshift({ t: nowLabel(), d: eventHtml.d, html: eventHtml.html });
      renderHero(); renderTree(); renderPhList();
      if (view === 'detail') { refreshTabs(); renderPane(); }
      if (after) after();
    }, (eventHtml && eventHtml.delay) || 1500);
  }

  /* ================================================================ 详情页事件委托 */
  $('viewDetail').addEventListener('click', e => {
    /* 返回 / 上一服务 / 下一服务 */
    if (e.target.closest('#btnBack')) { backHome(); return; }
    const list = Object.keys(SERVICES);
    const idx = list.indexOf(current);
    if (e.target.closest('#btnPrev')) { openDetail(list[(idx - 1 + list.length) % list.length]); return; }
    if (e.target.closest('#btnNext')) { openDetail(list[(idx + 1) % list.length]); return; }
    /* 资源卡跳页签（概览的「最近事件」→ 事件页签） */
    const goTab = e.target.closest('[data-goto]');
    if (goTab) { activeTab = goTab.dataset.goto; refreshTabs(); renderPane(); return; }

    /* 页签 */
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      activeTab = tab.dataset.tab;
      document.querySelectorAll('#viewDetail .dtab').forEach(x => x.classList.toggle('on', x.dataset.tab === activeTab));
      renderPane();
      return;
    }
    /* 日志文件选择 */
    const lf = e.target.closest('[data-logf]');
    if (lf) { logSel = +lf.dataset.logf; renderPane(); return; }
    /* 配置编辑模式切换 */
    const cm = e.target.closest('[data-cm]');
    if (cm) {
      const s = SERVICES[current];
      if (cm.dataset.cm === 'raw' && confMode === 'fields') $('confRaw').value = renderConfRaw(s);
      confMode = cm.dataset.cm;
      document.querySelectorAll('#confModeSeg button').forEach(x => x.classList.toggle('on', x === cm));
      $('confFields').style.display = confMode === 'fields' ? 'grid' : 'none';
      $('confRaw').style.display = confMode === 'raw' ? 'block' : 'none';
      return;
    }

    const el = e.target.closest('[data-act]');
    if (!el) return;
    const s = SERVICES[current];
    const act = el.dataset.act;

    if (act === 'start') {
      if (!isPending(s) && !isRunning(s)) setState(s, 'starting', 'Running', { d: 'run', html: `<b>${s.display}</b> 服务启动成功<span class="tag ok">启动</span>` });
    } else if (act === 'stop') {
      if (!isPending(s) && isRunning(s)) setState(s, 'stopping', 'Stopped', { d: 'stop', html: `<b>${s.display}</b> 服务已停止<span class="tag ok">停止</span>` });
    } else if (act === 'restart') {
      if (!isPending(s) && isRunning(s)) setState(s, 'restarting', 'Running', { d: 'run', html: `<b>${s.display}</b> 服务重启完成<span class="tag ok">重启</span>` });
    } else if (act === 'register') {
      askRegister(s);
    } else if (act === 'open-logdir') {
      toast('原型演示：将在资源管理器打开 ' + svcLogDir(s));
    } else if (act === 'open-workdir') {
      toast('原型演示：将在资源管理器打开 ' + (s.programFile ? dirOf(s.programFile) : '工作目录'));
    } else if (act === 'copy-run') {
      copyText(runCommand(s), '启动命令已复制');
    } else if (act === 'uninstall') {
      askUninstall(s);
    } else if (act === 'copy-cmd') {
      copyText(buildCommand(s), '安装命令已复制');
    } else if (act === 'flip') {
      const k = el.dataset.field;
      s.deploy[k] = !s.deploy[k];
      el.classList.toggle('on', s.deploy[k]);
      refreshCmdPreview(s);

    } else if (act === 'pick-jdk') {
      openJdkPicker();
    } else if (act === 'jvm-flag') {
      const flag = el.dataset.jvmFlag;
      const args = String(s.deploy.jvmArgs || '').split(/\s+/).filter(Boolean);
      const has = args.includes(flag);
      s.deploy.jvmArgs = (has ? args.filter(a => a !== flag) : [...args, flag]).join(' ');
      const inp = $('viewDetail').querySelector('input[data-field="jvmArgs"]');
      if (inp) inp.value = s.deploy.jvmArgs;
      refreshCmdPreview(s);
      renderPane();
    } else if (act === 'start-type') {
      const v = el.dataset.value;
      s.deploy.startType = v; s.startType = v;
      renderHero(); renderTree(); renderPhList(); renderPane();
    } else if (act === 'conf-save') {
      if (confMode === 'raw' && s.conf) parseRawToFields(s, $('confRaw').value);
      confDirty = true; refreshTabs(); renderPane(); toast('配置已保存（待重启生效）');
    } else if (act === 'conf-discard' || act === 'conf-later') {
      confDirty = false; refreshTabs(); renderPane();
    } else if (act === 'conf-restart') {
      if (isPending(s)) return;
      setState(s, 'restarting', 'Running', { d: 'run', html: `<b>${s.display}</b> 配置变更后重启完成<span class="tag ok">重启</span>`, delay: 1600 }, () => {
        confDirty = false; refreshTabs(); renderPane();
      });
    } else if (act === 'log-scroll') {
      el.classList.toggle('on');
    } else if (act === 'log-download') {
      toast('原型演示：已导出日志压缩包');
    }
  });

  /* 详情页输入：部署表单 / 配置字段 */
  $('viewDetail').addEventListener('input', e => {
    const el = e.target;
    const s = SERVICES[current]; if (!s) return;

    /* 堆内存滑杆拖动中：仅更新进度填充与数值输入框，不重渲染（提交走 change） */
    if (el.matches('.heap-range')) {
      el.style.setProperty('--fill', (+el.value / (HEAP_STOPS.length - 1) * 100) + '%');
      const inp = el.closest('.preset-row') && el.closest('.preset-row').querySelector('[data-heap-input]');
      if (inp) inp.value = heapLabel(HEAP_STOPS[+el.value]);
      return;
    }

    if (el.matches('[data-field]') && s.deploy) {
      const k = el.dataset.field, v = el.value;
      if (k === 'display') s.display = v;
      else if (k === 'desc') s.desc = v;
      else if (k === 'startType') { s.deploy.startType = v; s.startType = v; }
      else s.deploy[k] = v;
      if (k === 'startType') { renderHero(); renderTree(); renderPhList(); }
      refreshCmdPreview(s);
      return;
    }

    if (el.matches('[data-cf], #confRaw')) {
      if (el.matches('[data-cf]') && s.conf) {
        const f = s.conf.fields.find(x => x[0] === el.dataset.cf);
        if (f) f[2] = el.value;
      }
      confDirty = true; refreshTabs();
      const foot = $('viewDetail').querySelector('[data-act="conf-discard"]');
      if (foot) foot.style.display = 'inline-flex';
      const bar = $('restartBar'); if (bar) bar.classList.add('show');
    }
  });

  /* 堆内存滑杆松手提交：写入 -Xms/-Xmx 并刷新预览 */
  $('viewDetail').addEventListener('change', e => {
    const el = e.target;
    if (!el.matches || !el.matches('.heap-range')) return;
    const s = SERVICES[current]; if (!s || !s.deploy) return;
    heapApply(s, HEAP_STOPS[+el.value]);
  });

  /* 堆内存手动输入：回车或失焦提交（与滑杆同一写入路径 heapApply） */
  $('viewDetail').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches || !e.target.matches('[data-heap-input]')) return;
    const s = SERVICES[current]; if (!s || !s.deploy) return;
    heapCommitInput(s, e.target.value);
  });
  $('viewDetail').addEventListener('focusout', e => {
    if (!e.target.matches || !e.target.matches('[data-heap-input]')) return;
    const s = SERVICES[current]; if (!s || !s.deploy) return;
    const cur = heapParse(s.deploy.jvmArgs);
    const curDisp = isNaN(cur) ? '2G' : (HEAP_STOPS.includes(cur) ? heapLabel(cur) : heapNum(cur));
    if (e.target.value.trim() === curDisp) return;
    heapCommitInput(s, e.target.value);
  });

  /* ================================================================ JDK 选择器（JVM 路径字段的就地选择） */
  let jdkPick = -1;   // -1 = 以手动输入为准
  const curJavaPath = () => (SERVICES[current] && SERVICES[current].deploy ? SERVICES[current].deploy.javaPath : '');

  function renderJdkList() {
    const cur = curJavaPath();
    $('jdkList').innerHTML = JDK_CANDIDATES.length ? JDK_CANDIDATES.map((j, i) => `
      <button class="jd-item ${i === jdkPick ? 'on' : ''}" data-jdk="${i}">
        <span class="jd-radio"></span>
        <span class="jd-ver">${j.ver}</span>
        <div class="jd-main">
          <div class="jd-name">Java ${j.ver} · ${j.name}${j.path === cur ? '<span class="jd-tag cur">当前使用</span>' : ''}</div>
          <div class="jd-path" title="${escAttr(j.path)}">${escHtml(j.path)}</div>
        </div>
      </button>`).join('')
      : '<div class="jd-empty">未检测到本机 JDK，请在下方手动指定 java.exe 路径</div>';
  }
  function openJdkPicker() {
    const cur = curJavaPath();
    const hit = JDK_CANDIDATES.findIndex(j => j.path === cur);
    jdkPick = hit;                              // 命中候选则选中；否则 -1，落到手动输入
    $('jdkManual').value = hit >= 0 ? '' : cur;
    renderJdkList();
    $('jdkMask').classList.add('show');
  }
  function closeJdk() { $('jdkMask').classList.remove('show'); }
  function applyJdk() {
    const s = SERVICES[current];
    const manual = $('jdkManual').value.trim();
    const pick = manual || (JDK_CANDIDATES[jdkPick] ? JDK_CANDIDATES[jdkPick].path : '');
    if (!pick) { toast('请选择一个 JDK，或手动填写 java.exe 完整路径'); return; }
    if (s.deploy) s.deploy.javaPath = pick;
    const inp = $('viewDetail').querySelector('input[data-field="javaPath"]');
    if (inp) inp.value = pick;
    refreshCmdPreview(s);                       // 安装命令里的 --path 同步更新
    closeJdk();
    toast('JVM 路径已更新');
  }
  $('jdkList').addEventListener('click', e => {
    const it = e.target.closest('[data-jdk]'); if (!it) return;
    jdkPick = +it.dataset.jdk;
    $('jdkManual').value = '';
    renderJdkList();
  });
  $('jdkManual').addEventListener('input', () => { jdkPick = -1; renderJdkList(); });
  $('jdkCancel').addEventListener('click', closeJdk);
  $('jdkOk').addEventListener('click', applyJdk);
  $('jdkBrowse').addEventListener('click', () => toast('原型演示：将打开系统文件选择器选取 java.exe'));
  $('jdkMask').addEventListener('click', e => { if (e.target === $('jdkMask')) closeJdk(); });

  /* ESC：先关 JDK 选择器 → 再关确认弹窗 → 最后返回总览 */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('jdkMask').classList.contains('show')) { closeJdk(); return; }
    if ($('modalMask').classList.contains('show')) { hideConfirm(); return; }
    if (view === 'detail') backHome();
  });


  /* ================================================================ 安装流程（脚本 INSTALL 三步） */
  function runInstall(s, isReinstall) {
    if (isPending(s)) return;
    s._pending = 'installing';
    renderHero();
    const box = $('instSteps');
    if (box) {
      box.classList.add('show');
      box.innerHTML = [
        ['st1', '1', '预检依赖端口'],
        ['st2', '2', isReinstall ? '停止并清理旧服务' : '停止同名旧服务（如存在）'],
        ['st3', '3', '注册并启动'],
      ].map(([id, n, label]) => `<div class="step" id="${id}"><span class="s-ic">${n}</span>${label}<span class="s-sub"></span></div>`).join('');
    }
    const setStep = (id, cls, sub) => {
      const st = $(id); if (!st) return;
      st.className = 'step ' + cls;
      if (sub !== undefined) st.querySelector('.s-sub').textContent = sub;
      if (cls === 'doing') st.querySelector('.s-ic').innerHTML = '<svg class="ic spin"><use href="#i-restart"/></svg>';
      if (cls === 'done') st.querySelector('.s-ic').innerHTML = '<svg class="ic"><use href="#i-check"/></svg>';
      if (cls === 'warn') st.querySelector('.s-ic').innerHTML = '<svg class="ic"><use href="#i-warn"/></svg>';
    };
    const finish = () => {
      s._pending = null;
      s.state = 'Running';
      s.pid = s.pid || 1000 + Math.floor(Math.random() * 9000);
      s.uptime = s.uptime || '刚刚启动';
      s.startedAt = nowLabel().replace('今天 ', '');
      s.registered = true;
      s.mode = 'register';
      s.events.unshift({
        t: nowLabel(), d: 'run',
        html: `<b>${s.display}</b> ${isReinstall ? '重新安装并启动成功' : '托管接入成功，已注册并启动'}<span class="tag ok">${isReinstall ? '重装' : '接入托管'}</span>`,
      });
      renderHero(); renderTree(); renderPhList(); refreshTabs(); renderPane();
      toast(isReinstall ? '重新安装完成，服务已启动' : '托管接入完成，服务已启动');
      setTimeout(() => { const b = $('instSteps'); if (b) { b.classList.remove('show'); b.innerHTML = ''; } }, 1500);
    };
    setStep('st1', 'doing');
    setTimeout(() => {
      const down = s.depsPorts.filter(p => !p.ok).length;
      setStep('st1', down ? 'warn' : 'done', down ? `${s.depsPorts.length - down}/${s.depsPorts.length} 端口监听` : '全部监听');
      setStep('st2', 'doing');
      setTimeout(() => {
        setStep('st2', 'done', '已清理');
        setStep('st3', 'doing');
        setTimeout(() => {
          setStep('st3', 'done', 'SCM 注册成功');
          setTimeout(finish, 400);
        }, 900);
      }, 900);
    }, 1000);
  }

  /* ================================================================ 破坏性操作确认（脚本 UNINSTALL 的 Y/N） */
  let confirmCb = null;
  function askConfirm(title, html, okText, info, cb) {
    $('mdTitle').textContent = title;
    $('mdText').innerHTML = html;
    $('mdOk').textContent = okText;
    $('mdOk').style.background = info ? 'var(--gn-accent-strong)' : 'var(--gn-danger)';
    const ic = $('modalMask').querySelector('.m-ic');
    if (ic) {
      ic.classList.toggle('info', !!info);
      ic.innerHTML = `<svg class="ic"><use href="#${info ? 'i-shield' : 'i-warn'}"/></svg>`;
    }
    confirmCb = cb;
    $('modalMask').classList.add('show');
  }

  /* 注册 / 重新注册：对应脚本 INSTALL（停止 → 卸载旧注册 → 注册 → 启动） */
  function askRegister(s) {
    const isRe = s.registered;
    askConfirm(
      isRe ? '重新注册服务' : '注册为 Windows 服务',
      isRe
        ? '将按脚本 INSTALL 重新写回 SCM：<b>停止 → 卸载旧注册 → 注册 → 启动</b>。'
          + '服务会短暂中断，程序文件、数据与日志均不受影响。确认继续？'
        : `将通过 servy 引擎把 <code>${escHtml(s.name)}</code> 注册为 Windows 服务，`
          + '获得开机自启、崩溃守护重启与日志轮转。确认继续？',
      isRe ? '确认重新注册' : '确认注册',
      true,
      () => { hideConfirm(); runInstall(s, isRe); }
    );
  }

  /* 卸载：对应脚本 UNINSTALL */
  function askUninstall(s) {
    askConfirm(
      '卸载服务',
      `将先停止并从 Windows 服务控制器移除 <code>${escHtml(s.name)}</code>（servy 托管）。`
      + '程序文件与日志目录会保留，注册信息可在「注册」中恢复。确认卸载？',
      '确认卸载',
      false,
      () => {
        hideConfirm();
        if (isPending(s)) return;
        const wasRunning = isRunning(s);
        s._pending = 'uninstalling';
        renderHero();
        setTimeout(() => {
          s._pending = null;
          s.state = 'Stopped'; s.pid = null; s.uptime = null; s.startedAt = null;
          s.registered = false; s.mode = 'manage';
          s.events.unshift({ t: nowLabel(), d: 'warn', html: `<b>${s.display}</b> 服务已卸载（servy 托管移除，文件保留）<span class="tag warn">卸载</span>` });
          renderHero(); renderTree(); renderPhList(); refreshTabs(); renderPane();
          toast('服务已卸载');
        }, wasRunning ? 1400 : 800);
      }
    );
  }
  function hideConfirm() { $('modalMask').classList.remove('show'); confirmCb = null; }
  $('mdCancel').addEventListener('click', hideConfirm);
  $('modalMask').addEventListener('click', e => { if (e.target === $('modalMask')) hideConfirm(); });
  $('mdOk').addEventListener('click', () => { if (confirmCb) confirmCb(); });

  /* ================================================================ 指标轮询（模拟 SampleServiceMetrics，2s） */
  setInterval(() => {
    if (view !== 'detail' || !current) return;
    const s = SERVICES[current];
    if (!canSample(s)) return;
    const r = s.res;
    r.cpu = Math.max(0.4, Math.min(18, r.cpu + (Math.random() - 0.5) * 1.6));
    r.mem = Math.max(32, Math.round(Math.min(r.memMax, r.mem + (Math.random() - 0.5) * 18)));
    r.threads = Math.max(8, Math.round(r.threads + (Math.random() - 0.5) * 6));
    r.handles = Math.max(120, Math.round(r.handles + (Math.random() - 0.5) * 20));
    r.diskR = Math.max(0.05, r.diskR + (Math.random() - 0.5) * 0.3);
    r.netRx = Math.max(1, r.netRx + (Math.random() - 0.5) * 6);
    r.trend.cpu.push(r.cpu); r.trend.cpu.shift();
    r.trend.mem.push(r.mem); r.trend.mem.shift();
    r.trend.threads.push(r.threads); r.trend.threads.shift();
    r.trend.handles.push(r.handles); r.trend.handles.shift();
    if (activeTab !== 'overview') return;
    const cu = $('rCpu'), me = $('rMem'), th = $('rThr'), hd = $('rHnd');
    if (!cu) return;
    const mp = pctOf(r.mem, r.memMax);
    cu.textContent = r.cpu.toFixed(1);
    me.textContent = r.mem;
    const bar = $('rMemBar');
    if (bar) { bar.style.width = mp + '%'; bar.style.background = mp >= 80 ? 'var(--gn-warn)' : 'var(--gn-info)'; }
    th.textContent = r.threads;
    hd.textContent = r.handles.toLocaleString();
    const lc = $('lgCpu'), lm = $('lgMem'), lt = $('lgThr');
    if (lc) lc.textContent = r.cpu.toFixed(1) + '%';
    if (lm) lm.textContent = r.mem + ' MB';
    if (lt) lt.textContent = r.threads;
    drawTrend();
  }, 2000);

  /* ================================================================ 初始化 */
  renderTree();
  renderPhList();
  openDetail('WEC-AI-PLATFORM');   // 默认直接进入详情，便于查看本次改版
</script>
</body>
</html>
